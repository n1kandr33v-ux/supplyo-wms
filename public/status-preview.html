<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статусы сборки</title><style>body{margin:0;background:#000;color:#fafafa;font:14px 'Segoe UI',sans-serif;padding:40px}main{max-width:850px;margin:auto;background:#161616;padding:32px;border-radius:16px}h1{font-size:22px;margin:0 0 28px}section{display:flex;align-items:center;gap:36px;padding:22px 0;border-bottom:1px solid #1f2023}section:last-child{border:0}.badge{min-width:115px;text-align:center;padding:5px 10px;border-radius:7px;font-size:12px;border:1px solid #38373d}.waiting{color:#c69035;background:#30291d}.checking{color:#8b8fff;background:#252537}.ready{color:#39ad79;background:#1a2d24}.error{color:#fa6f78;background:#352024}p{margin:0;color:#cfcfcf;line-height:1.5}.spinner{display:inline-block;width:9px;height:9px;border:1px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){body{padding:16px}section{gap:16px}main{padding:20px}}</style><main><h1>Статусы сборки</h1><section><span class="badge waiting">Ожидает</span><p>Товар ожидает сканирования или ввода КИЗ.</p></section><section><span class="badge checking"><span class="spinner"></span>Проверяется</span><p>Код отправлен на проверку, ожидается результат.</p></section><section><span class="badge ready">✓ Готов</span><p>Обработка заказа успешно подтверждена.</p></section><section><span class="badge error">Ошибка</span><p>Не удалось завершить обработку или печать.</p></section><section><span class="badge error">Ошибка КИЗ</span><p>Неверный код маркировки или повторно использованный КИЗ.</p></section></main></html>
