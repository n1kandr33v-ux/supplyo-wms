<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="2526" viewBox="0 0 2280 2526">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="2280" height="2526" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 07</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">07 · Сотрудник: добавление, вход и права</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Администратор склада → сотрудник</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Назначение по email. Письма-приглашения не отправляются.</text>
<path d="M 376.66666666666663 436 L 376.66666666666663 556" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 376.66666666666663 740 L 376.66666666666663 916" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 376.66666666666663 1156 L 376.66666666666663 1332" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1128.3333333333335 740 L 1128.3333333333335 860.0" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1205 1153.3333333333335 L 1205 1250 L 1535 1250 L 1535 1664" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1051.6666666666667 1153.3333333333333 L 1051.6666666666667 1664" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 453.33333333333337 1544 L 453.33333333333337 1582 L 898.3333333333334 1582 L 898.3333333333334 1664" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 975 1960 L 975 2024 L 1420 2024 L 1420 2080" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1090 1960 L 1090 1998 L 1980 1998 L 1980 2080" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 1544 L 300 1734" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 1890 L 300 2080" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 1960 L 860 2080" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1534" y="1423" width="57" height="30" rx="4" fill="white"/>
<text x="1562.5" y="1445" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Нет</text>
<rect x="1004.6666666666667" y="1423" width="49" height="30" rx="4" fill="white"/>
<text x="1029.1666666666667" y="1445" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Да</text>
<rect x="146.66666666666666" y="280" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Главный администратор /</text>
<text x="376.66666666666663" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">управляющий</text>
<text x="376.66666666666663" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">06 Склады → Добавить сотрудника.</text>
<rect x="146.66666666666666" y="556" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="613.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ФИО + email сотрудника</text>
<text x="376.66666666666663" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Выдать конкретные разрешения на</text>
<text x="376.66666666666663" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ЭТОМ складе.</text>
<text x="376.66666666666663" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Без кнопок-предустановок ролей.</text>
<rect x="146.66666666666666" y="916" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="973.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПРАВА</text>
<text x="376.66666666666663" y="1001.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Просмотр заказов и остатков</text>
<text x="376.66666666666663" y="1029.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сборка / КИЗ / печать</text>
<text x="376.66666666666663" y="1057.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Создание поставок / доставка</text>
<text x="376.66666666666663" y="1085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Изменение остатков / размещения</text>
<text x="376.66666666666663" y="1113.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Управление складом / сотрудниками</text>
<rect x="146.66666666666666" y="1332" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="1389.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Сохранить назначение</text>
<text x="376.66666666666663" y="1417.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">У аккаунта работодателя активна</text>
<text x="376.66666666666663" y="1445.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подписка.</text>
<text x="376.66666666666663" y="1473.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">В карточке сотрудник: ФИО, затем</text>
<text x="376.66666666666663" y="1501.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">email.</text>
<rect x="898.3333333333334" y="556" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1128.3333333333335" y="613.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОТРУДНИК</text>
<text x="1128.3333333333335" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Открывает сайт и регистрируется /</text>
<text x="1128.3333333333335" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">входит с ТОЧНО ТЕМ email, который</text>
<text x="1128.3333333333335" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">добавили.</text>
<polygon points="1128.3333333333335,860 1358.3333333333335,1036.0 1128.3333333333335,1212 898.3333333333334,1036.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="1128.3333333333335" y="987.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Сервер сопоставляет</text>
<text x="1128.3333333333335" y="1015.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">email</text>
<text x="1128.3333333333335" y="1043.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Находит назначения,</text>
<text x="1128.3333333333335" y="1071.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">активного работодателя</text>
<text x="1128.3333333333335" y="1099.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">и привязки складов WB.</text>
<rect x="1305" y="1664" width="460" height="212" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="1535.0" y="1721.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Доступ не найден</text>
<text x="1535.0" y="1749.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверить email, назначение на склад,</text>
<text x="1535.0" y="1777.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подписку работодателя и WB-привязку.</text>
<text x="1535.0" y="1805.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Личная покупка подписки проблему не</text>
<text x="1535.0" y="1833.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">решает.</text>
<rect x="745" y="1664" width="460" height="296" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="975.0" y="1721.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Разрешённый рабочий контекст</text>
<text x="975.0" y="1749.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только назначенный физический склад</text>
<text x="975.0" y="1777.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">и его кабинеты / склады WB.</text>
<text x="975.0" y="1805.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Личная подписка не нужна.</text>
<text x="975.0" y="1833.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Подключение второго клиента не</text>
<text x="975.0" y="1861.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">обнуляет доступ к первому.</text>
<text x="975.0" y="1889.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Отзыв действует только на выбранный</text>
<text x="975.0" y="1917.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">кабинет.</text>
<a href="#08"><title>Открыть раздел 08</title>
<rect x="1190" y="2080" width="460" height="184" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="1420.0" y="2137.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">08 Обзор → работа по правам</text>
<text x="1420.0" y="2165.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Просмотр → 09 / 14</text>
<text x="1420.0" y="2193.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сборка → 10 / 11 / 13</text>
<text x="1420.0" y="2221.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Отгрузка → 12</text>
</a>
<rect x="70" y="1734" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="300.0" y="1791.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Изменить сотрудника</text>
<text x="300.0" y="1819.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Кнопки редактирования ФИО / email.</text>
<text x="300.0" y="1847.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Изменить права или удалить доступ.</text>
<rect x="1750" y="2080" width="460" height="184" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="1980.0" y="2137.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Защита</text>
<text x="1980.0" y="2165.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Нельзя получить чужие склады,</text>
<text x="1980.0" y="2193.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">API-ключи, чужую бухгалтерию</text>
<text x="1980.0" y="2221.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">или повысить собственные права.</text>
<rect x="70" y="2080" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="300.0" y="2137.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Удалён доступ / истекла подписка ФФ</text>
<text x="300.0" y="2165.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сервер прекращает доступ к</text>
<text x="300.0" y="2193.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">операциям.</text>
<text x="300.0" y="2221.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Уже открытая вкладка не сохраняет</text>
<text x="300.0" y="2249.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">старые права.</text>
<rect x="630" y="2080" width="460" height="184" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="860.0" y="2137.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Несколько работодателей / свои</text>
<text x="860.0" y="2165.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">магазины</text>
<text x="860.0" y="2193.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Аккаунт остаётся одним.</text>
<text x="860.0" y="2221.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Каждый ресурс проверяется отдельно.</text>
<text x="70" y="2392" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Для старых организаций с одним физическим складом без ручной привязки сотрудник наследует все активные клиентские доступы, каждый только к разрешённому складу WB. Новый кабинет не отменяет</text>
<text x="70" y="2420" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">прежние доступы. Явный список привязок (в том числе пустой) имеет приоритет; при нескольких физических складах привязки назначает администратор. Свои API-магазины автоматически сотрудникам не</text>
<text x="70" y="2448" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">выдаются.</text>
<text x="70" y="2498" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>