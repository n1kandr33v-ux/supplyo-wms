<rect x="1304" y="582" width="202" height="30" rx="4" fill="white"/>
<text x="1405.0" y="604" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Новый пользователь</text>
<rect x="614" y="582" width="133" height="30" rx="4" fill="white"/>
<text x="680.5" y="604" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Есть аккаунт</text>
<rect x="694.6666666666667" y="1392" width="57" height="30" rx="4" fill="white"/>
<text x="723.1666666666667" y="1414" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Нет</text>
<rect x="613.3333333333333" y="1392" width="57" height="30" rx="4" fill="white"/>
<text x="641.8333333333333" y="1414" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Нет</text>
<rect x="1334.6666666666665" y="1392" width="49" height="30" rx="4" fill="white"/>
<text x="1359.1666666666665" y="1414" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Да</text>
<rect x="774.6666666666666" y="1392" width="49" height="30" rx="4" fill="white"/>
<text x="799.1666666666666" y="1414" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Да</text>
<rect x="998.3333333333333" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1228.3333333333333" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Посадочная страница</text>
<text x="1228.3333333333333" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Возможности · начало работы · тарифы</text>
<text x="1228.3333333333333" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">· вопросы</text>
<text x="1228.3333333333333" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Кнопки «Начать работу» и «Войти».</text>
<rect x="1075" y="730" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1305.0" y="787.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Регистрация</text>
<text x="1305.0" y="815.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ФИО · email · телефон</text>
<text x="1305.0" y="843.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Пароль + подтверждение</text>
<text x="1305.0" y="871.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Согласие с условиями.</text>
<rect x="515" y="744" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="745.0" y="801.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Вход</text>
<text x="745.0" y="829.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Email + пароль</text>
<text x="745.0" y="857.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Показать / скрыть пароль.</text>
<polygon points="1305.0,1034 1535,1154.0 1305.0,1274 1075,1154.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="1305.0" y="1133.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Данные корректны?</text>
<text x="1305.0" y="1161.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Email свободен?</text>
<text x="1305.0" y="1189.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Пароли совпадают?</text>
<polygon points="745.0,1034 975,1154.0 745.0,1274 515,1154.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="745.0" y="1133.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Почта и пароль верны?</text>
<text x="745.0" y="1161.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Нет превышения лимита</text>
<text x="745.0" y="1189.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">попыток?</text>
<rect x="443" y="1540" width="460" height="184" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="673.0" y="1597.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Ошибка рядом с полем</text>
<text x="673.0" y="1625.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Почта занята / неверный формат /</text>
<text x="673.0" y="1653.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">неверные данные.</text>
<text x="673.0" y="1681.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Повторный ввод без потери формы.</text>
<rect x="1075" y="1540" width="460" height="184" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="1305.0" y="1597.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Сервер создаёт сессию</text>
<text x="1305.0" y="1625.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Пароль хранится как хеш.</text>
<text x="1305.0" y="1653.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сессия в защищённой cookie.</text>
<text x="1305.0" y="1681.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">API-ключ для входа не используется.</text>
<rect x="1075" y="1844" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1305.0" y="1901.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Загрузить аккаунт, подписку и доступы</text>
<text x="1305.0" y="1929.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Свои магазины + принятые доступы</text>
<text x="1305.0" y="1957.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">клиентов + права сотрудника.</text>
<text x="1305.0" y="1985.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Роль не выбирается по одному email</text>
<text x="1305.0" y="2013.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">или факту подписки.</text>
<rect x="630" y="2176" width="460" height="212" rx="14" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="860.0" y="2233.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Нет рабочих подключений</text>
<text x="860.0" y="2261.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Доступны настройки магазина,</text>
<text x="860.0" y="2289.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">профиль и подписка.</text>
<text x="860.0" y="2317.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Рабочие действия ВМС</text>
<text x="860.0" y="2345.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">заблокированы.</text>
<rect x="1190" y="2176" width="460" height="184" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="1420.0" y="2233.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Есть доступ сотрудника</text>
<text x="1420.0" y="2261.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Вход в назначенные склады без</text>
<text x="1420.0" y="2289.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">покупки личной подписки.</text>
<text x="1420.0" y="2317.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Подписка проверяется у работодателя.</text>
<a href="#08"><title>Открыть раздел 08</title>
<rect x="70" y="2176" width="460" height="184" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="300.0" y="2233.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Есть свои / клиентские склады</text>
<text x="300.0" y="2261.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">08 Обзор → разрешённые разделы</text>
<text x="300.0" y="2289.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Если собственная подписка неактивна,</text>
<text x="300.0" y="2317.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">рабочие действия ограничены.</text>
</a>
<text x="70" y="2488" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Вход и регистрация используют существующий аккаунт. Доступ сотрудника сопоставляется по email. Письма подтверждения и восстановления пока не</text>
<text x="70" y="2516" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">подключены. Android-вход — раздел 20.</text>
<text x="70" y="2570" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>