<path d="M 1228.3333333333333 1234.0 L 1228.3333333333333 1312 L 749.6666666666667 1312 L 749.6666666666667 1540" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 668.3333333333333 1234.0 L 668.3333333333333 1458 L 596.3333333333334 1458 L 596.3333333333334 1540" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
