<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="4236" viewBox="0 0 1500 4236">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="1500" height="4236" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 23</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">23 · Ozon: сборка и сохранение КИЗ</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Владелец / ФФ / назначенный сотрудник</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Сборка единиц, сохранение КИЗ и подтверждаемое завершение в Ozon. Реальный кабинет ещё не подключён; внешние ответы</text>
<text x="70" y="191" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">проверены fixtures.</text>
<path d="M 376.66666666666663 464 L 376.66666666666663 584" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 376.66666666666663 768 L 376.66666666666663 888" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 376.66666666666663 1072 L 376.66666666666663 1192.0" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 1578.6666666666667 L 300 2530" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 453.33333333333337 1578.6666666666665 L 453.33333333333337 1694 L 936.6666666666666 1694 L 936.6666666666666 1922" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 2106 L 860 2226" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 2410 L 860 2530" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 783.3333333333334 2714 L 783.3333333333334 2898 L 453.33333333333337 2898 L 453.33333333333337 2980" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 936.6666666666667 2714 L 936.6666666666667 2980" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1090 2980 L 1090 2898 L 1190 2898 L 1190 2144 L 1013.3333333333333 2144 L 1013.3333333333333 2106" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 2714 L 300 2980" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 376.66666666666663 3192 L 376.66666666666663 3312" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 376.66666666666663 3496 L 376.66666666666663 3762" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="245" y="1999" width="57" height="30" rx="4" fill="white"/>
<text x="273.5" y="2021" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Нет</text>
<rect x="935.6666666666666" y="1774" width="49" height="30" rx="4" fill="white"/>
<text x="960.1666666666666" y="1796" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Да</text>
<rect x="636.3333333333334" y="2832" width="149" height="30" rx="4" fill="white"/>
<text x="710.8333333333334" y="2854" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Положительно</text>
<rect x="845.6666666666667" y="2832" width="93" height="30" rx="4" fill="white"/>
<text x="892.1666666666667" y="2854" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Ошибка</text>
<rect x="1189" y="2607" width="115" height="30" rx="4" fill="white"/>
<text x="1246.5" y="2629" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Исправить</text>
<rect x="228.66666666666663" y="3614" width="150" height="30" rx="4" fill="white"/>
<text x="303.66666666666663" y="3636" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Подтверждено</text>
<rect x="146.66666666666666" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ДОСТУП</text>
<text x="376.66666666666663" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Подписка / назначение, разрешённый</text>
<text x="376.66666666666663" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">склад. Просмотр, сборка и завершение</text>
<text x="376.66666666666663" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">проверяются отдельно.</text>
<rect x="146.66666666666666" y="584" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СБОРКА OZON</text>
<text x="376.66666666666663" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ожидающие упаковки. Склад, номер</text>
<text x="376.66666666666663" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отправления, поиск, страницы и общий</text>
<text x="376.66666666666663" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">счётчик единиц.</text>
<rect x="146.66666666666666" y="888" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="945.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СКАН ТОВАРА</text>
<text x="376.66666666666663" y="973.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Баркод / SKU / артикул → следующий</text>
<text x="376.66666666666663" y="1001.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">свободный экземпляр. Повтор запроса</text>
<text x="376.66666666666663" y="1029.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">идемпотентен.</text>
<polygon points="376.66666666666663,1192 606.6666666666666,1424.0 376.66666666666663,1656 146.66666666666666,1424.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="376.66666666666663" y="1347.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">НУЖЕН КИЗ?</text>
<text x="376.66666666666663" y="1375.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Признак карточки +</text>
<text x="376.66666666666663" y="1403.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">требования</text>
<text x="376.66666666666663" y="1431.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отправления.</text>
<text x="376.66666666666663" y="1459.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Неизвестно —</text>
<text x="376.66666666666663" y="1487.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">остановить действие, не</text>
<text x="376.66666666666663" y="1515.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">считать немаркируемым.</text>
<rect x="70" y="2530" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="300.0" y="2587.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">БЕЗ КИЗ</text>
<text x="300.0" y="2615.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Единица отмечается собранной.</text>
<text x="300.0" y="2643.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Следующий скан берёт следующую</text>
<text x="300.0" y="2671.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">единицу.</text>
<rect x="706.6666666666666" y="1922" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="936.6666666666666" y="1979.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">КИЗ ТОВАРА</text>
<text x="936.6666666666666" y="2007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Автоматическое окно. Проверка</text>
<text x="936.6666666666666" y="2035.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">структуры, запрет повторного кода,</text>
<text x="936.6666666666666" y="2063.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отдельная бронь экземпляра.</text>
<rect x="630" y="2226" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="2283.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОХРАНЕНИЕ В OZON</text>
<text x="860.0" y="2311.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Свежий полный набор экземпляров →</text>
<text x="860.0" y="2339.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">добавить код, сохранить старые коды,</text>
<text x="860.0" y="2367.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ГТД, РНПТ, вес и прочие маркировки.</text>
<rect x="630" y="2530" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="2587.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПРОВЕРКА</text>
<text x="860.0" y="2615.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Постоянная очередь, общий повтор по</text>
<text x="860.0" y="2643.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отправлению каждые 15 секунд. HTTP</text>
<text x="860.0" y="2671.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">200 не означает принятие КИЗ.</text>
<rect x="783.3333333333334" y="2980" width="460" height="212" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="1013.3333333333334" y="3037.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОШИБКА / НЕЯСНЫЙ ОТВЕТ</text>
<text x="1013.3333333333334" y="3065.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ошибка КИЗ → исправление.</text>
<text x="1013.3333333333334" y="3093.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Потерянный ответ → чтение статуса</text>
<text x="1013.3333333333334" y="3121.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">без слепого повтора записи. 429 →</text>
<text x="1013.3333333333334" y="3149.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сохранённая пауза.</text>
<rect x="146.66666666666666" y="2980" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="3037.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ГОТОВ</text>
<text x="376.66666666666663" y="3065.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Собраны все единицы. Для</text>
<text x="376.66666666666663" y="3093.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">маркируемых подтверждены именно</text>
<text x="376.66666666666663" y="3121.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сохранённые коды. Фокус</text>
<text x="376.66666666666663" y="3149.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">возвращается сканеру.</text>
<rect x="146.66666666666666" y="3312" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="3369.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЗАВЕРШИТЬ СБОРКУ</text>
<text x="376.66666666666663" y="3397.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Подтверждение одной упаковки.</text>
<text x="376.66666666666663" y="3425.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Перечитать состав и КИЗ, вызвать</text>
<text x="376.66666666666663" y="3453.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ozon ship только один раз.</text>
<rect x="146.66666666666666" y="3762" width="460" height="212" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="376.66666666666663" y="3819.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОДТВЕРЖДЕНИЕ OZON</text>
<text x="376.66666666666663" y="3847.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверять фактический</text>
<text x="376.66666666666663" y="3875.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">awaiting_deliver. Не повторять</text>
<text x="376.66666666666663" y="3903.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">неопределённую операцию. История и</text>
<text x="376.66666666666663" y="3931.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">коды сохраняются.</text>
<text x="70" y="4074" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Надписи о необходимости маркировки и ТН ВЭД в таблице скрыты. Готовность здесь означает сборку единицы и положительную</text>
<text x="70" y="4102" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">проверку её КИЗ, а не печать этикетки. Многокоробочная сборка завершается в Ozon; печать, документы отгрузки и остатки ещё</text>
<text x="70" y="4130" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">не подключены. Код записывается у экземпляра отправления, не в карточке товара. Неизвестные требования не считаются</text>
<text x="70" y="4158" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">отсутствием КИЗ. Печать этикеток Ozon подключена в главе 24; документы перевозки и остатки остаются отдельными этапами.</text>
<text x="70" y="4208" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>