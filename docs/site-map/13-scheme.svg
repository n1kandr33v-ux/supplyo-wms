<svg xmlns="http://www.w3.org/2000/svg" width="2317" height="3616" viewBox="0 0 2317 3616">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="2317" height="3616" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 13</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">13 · Печать: настройки, агент и повтор</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Каждое рабочее место сборщика</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Windows-агент, диагностика, одиночная и пакетная печать и безопасный повтор реализованы. Подписанный установщик — план.</text>
<path d="M 1518.3333333333333 464 L 1518.3333333333333 584" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1671.6666666666667 464 L 1671.6666666666667 502 L 1786.3333333333335 502 L 1786.3333333333335 834 L 1671.6666666666667 834 L 1671.6666666666667 916" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1518.3333333333333 796 L 1518.3333333333333 916" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1595 1128 L 1595 1248" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1595 1432 L 1595 1552" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1595 1792 L 1595 1912" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1480 2180 L 1480 2446" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1710 2180 L 1710 2218 L 2017 2218 L 2017 2750" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 2017 3046 L 2017 3084 L 1863 3084 L 1863 3166" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1748 3166 L 1748 2244 L 1595 2244 L 1595 2180" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1480 2630 L 1480 3084 L 1633 3084 L 1633 3166" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1406" y="2298" width="76" height="30" rx="4" fill="white"/>
<text x="1444.0" y="2320" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Успех</text>
<rect x="1950" y="2298" width="69" height="30" rx="4" fill="white"/>
<text x="1984.5" y="2320" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Сбой</text>
<rect x="1339" y="2883" width="143" height="30" rx="4" fill="white"/>
<text x="1410.5" y="2905" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Перепечатать</text>
<rect x="1365" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1595.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">НАСТРОЙКИ → ПЕЧАТЬ ЭТИКЕТОК</text>
<text x="1595.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Поиск принтеров и скачивание агента</text>
<text x="1595.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">находятся здесь, а не в таблице</text>
<text x="1595.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сборки.</text>
<rect x="1288.3333333333333" y="584" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1518.3333333333333" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЗАПУСТИТЬ АГЕНТ WINDOWS</text>
<text x="1518.3333333333333" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Скачать один supply-print-agent.exe →</text>
<text x="1518.3333333333333" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">открыть. Без архива и установки,</text>
<text x="1518.3333333333333" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">работает в трее. После перезапуска</text>
<text x="1518.3333333333333" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Windows открыть снова.</text>
<rect x="1365" y="916" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1595.0" y="973.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">АВТОМАТИЧЕСКОЕ ПОДКЛЮЧЕНИЕ</text>
<text x="1595.0" y="1001.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">В настройках каждые 5 секунд</text>
<text x="1595.0" y="1029.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">проверяется агент. Принтер Windows</text>
<text x="1595.0" y="1057.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">по умолчанию выбирается</text>
<text x="1595.0" y="1085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">автоматически, выбор можно изменить.</text>
<rect x="1365" y="1248" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1595.0" y="1305.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ВЫБРАТЬ ПРИНТЕР</text>
<text x="1595.0" y="1333.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сохранить выбор для этого рабочего</text>
<text x="1595.0" y="1361.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">места / браузера.</text>
<text x="1595.0" y="1389.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверить формат этикетки.</text>
<rect x="1365" y="1552" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1595.0" y="1609.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЗАДАНИЕ ПЕЧАТИ</text>
<text x="1595.0" y="1637.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">10 — товар без КИЗ</text>
<text x="1595.0" y="1665.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">11 — товар с КИЗ</text>
<text x="1595.0" y="1693.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">12 / 14 — поставка / короба.</text>
<text x="1595.0" y="1721.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Передать файл этикетки, не всю</text>
<text x="1595.0" y="1749.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">страницу.</text>
<rect x="1365" y="1912" width="460" height="268" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1595.0" y="1969.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЛОКАЛЬНЫЙ АГЕНТ</text>
<text x="1595.0" y="1997.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Для «Авто» получить все этикетки и</text>
<text x="1595.0" y="2025.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">заранее загрузить все изображения.</text>
<text x="1595.0" y="2053.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Затем одно PrintDocument / одно</text>
<text x="1595.0" y="2081.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">задание очереди Windows.</text>
<text x="1595.0" y="2109.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Вернуть результат принятия задания</text>
<text x="1595.0" y="2137.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">целиком.</text>
<rect x="1250" y="2446" width="460" height="184" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="1480.0" y="2503.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЗАДАНИЕ ПРИНЯТО</text>
<text x="1480.0" y="2531.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Обновить результат печати заказа.</text>
<text x="1480.0" y="2559.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ответ очереди Windows не доказывает</text>
<text x="1480.0" y="2587.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">физический выход бумаги.</text>
<rect x="1787" y="2750" width="460" height="296" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="2017.0" y="2807.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">АГЕНТ НЕДОСТУПЕН</text>
<text x="2017.0" y="2835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Отдельная понятная ошибка: запустить</text>
<text x="2017.0" y="2863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">supply-print-agent.exe, проверить</text>
<text x="2017.0" y="2891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">настройки печати и доступ к локальной</text>
<text x="2017.0" y="2919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сети.</text>
<text x="2017.0" y="2947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сбой сервера supply показывается</text>
<text x="2017.0" y="2975.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отдельно. Сохранённое задание</text>
<text x="2017.0" y="3003.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">остаётся для повтора.</text>
<rect x="1518" y="3166" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1748.0" y="3223.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОВТОР И ПЕРЕПЕЧАТКА</text>
<text x="1748.0" y="3251.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сбой агента или подтверждения: тот</text>
<text x="1748.0" y="3279.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">же job ID, принтер и файлы.</text>
<text x="1748.0" y="3307.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">duplicate означает прежнее принятие в</text>
<text x="1748.0" y="3335.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">очередь. Явная новая перепечатка —</text>
<text x="1748.0" y="3363.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">новый job ID.</text>
<rect x="70" y="280" width="460" height="184" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="300.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">БЕЗОПАСНОСТЬ АГЕНТА</text>
<text x="300.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Доверенные источники и привязка</text>
<text x="300.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">рабочего места.</text>
<text x="300.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Секрет WB не передавать принтеру.</text>
<rect x="660" y="280" width="460" height="212" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="890.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПЛАН ДЛЯ КЛИЕНТОВ</text>
<text x="890.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Цифровая подпись, установщик,</text>
<text x="890.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">автозапуск и обновления. Сейчас</text>
<text x="890.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">переносимый EXE без подписи; журнал</text>
<text x="890.0" y="449.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ошибок уже есть.</text>
<text x="70" y="3506" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Ответ агента доказывает передачу в очередь Windows, а не выход бумаги. Нужна проверка на реальном принтере. Телефон не подтверждает печать рабочего места.</text>
<text x="70" y="3588" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>