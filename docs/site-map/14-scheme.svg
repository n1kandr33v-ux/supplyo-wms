<rect x="794" y="1274" width="98" height="30" rx="4" fill="white"/>
<text x="843.0" y="1296" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Открыта</text>
<rect x="1449" y="1274" width="109" height="30" rx="4" fill="white"/>
<text x="1503.5" y="1296" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Передана</text>
<rect x="3235.6666666666665" y="2030" width="57" height="30" rx="4" fill="white"/>
<text x="3264.1666666666665" y="2052" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Нет</text>
<rect x="2629.6666666666665" y="2030" width="49" height="30" rx="4" fill="white"/>
<text x="2654.1666666666665" y="2052" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Да</text>
<rect x="736.6666666666666" y="280" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="966.6666666666666" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОСТАВКИ</text>
<text x="966.6666666666666" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только разрешённый склад и кабинет.</text>
<text x="966.6666666666666" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">В поставке всегда один склад.</text>
<rect x="2776.6666666666665" y="280" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="3006.6666666666665" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОСТАТКИ И РАЗМЕЩЕНИЕ</text>
<text x="3006.6666666666665" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Каталог и остатки WB загружаются в</text>
<text x="3006.6666666666665" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">фоне.</text>
<text x="3006.6666666666665" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только разрешённый кабинет и склад.</text>
<text x="3006.6666666666665" y="449.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сотрудник — в рамках назначенных</text>
<text x="3006.6666666666665" y="477.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">прав.</text>
<rect x="736.6666666666666" y="556" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="966.6666666666666" y="613.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ФИЛЬТР ПО ДАТЕ СОЗДАНИЯ</text>
<text x="966.6666666666666" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Начало → конец, обе границы</text>
<text x="966.6666666666666" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">включительно; сброс в календаре.</text>
<text x="966.6666666666666" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Даты фильтра и время таблицы —</text>
<text x="966.6666666666666" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Europe/Moscow, а не часовой пояс</text>
<text x="966.6666666666666" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">браузера.</text>
<rect x="2853.333333333333" y="677.3333333333333" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="3083.333333333333" y="734.3333333333333" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ФИЛЬТРЫ ОСТАТКОВ</text>
<text x="3083.333333333333" y="762.3333333333333" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Поиск по товару / всем баркодам /</text>
<text x="3083.333333333333" y="790.3333333333333" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">коде.</text>
<text x="3083.333333333333" y="818.3333333333333" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">«В наличии» или «Все товары».</text>
<rect x="736.6666666666666" y="916" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="966.6666666666666" y="973.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОЛНАЯ СТРОКА ПОСТАВКИ</text>
<text x="966.6666666666666" y="1001.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Название и ID · склад · создана ·</text>
<text x="966.6666666666666" y="1029.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">передана · без КИЗ / с КИЗ · короба ·</text>
<text x="966.6666666666666" y="1057.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">СЦ/ПВЗ · статус · печать стикера.</text>
<text x="966.6666666666666" y="1085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">sgtin в requiredMeta или optionalMeta</text>
<text x="966.6666666666666" y="1113.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">считается КИЗ.</text>
<rect x="2930" y="1028" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="3160.0" y="1085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ИТОГИ ОСТАТКОВ</text>
<text x="3160.0" y="1113.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Общий остаток, позиций в наличии.</text>
<text x="3160.0" y="1141.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Все баркоды: первый крупнее,</text>
<text x="3160.0" y="1169.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">остальные меньше.</text>
<a href="#10"><title>Открыть раздел 10</title>
<rect x="660" y="1422" width="460" height="184" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="890.0" y="1479.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">НА СБОРКЕ</text>
<text x="890.0" y="1507.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Название и статус выглядят</text>
<text x="890.0" y="1535.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">нажимаемыми.</text>
<text x="890.0" y="1563.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Открыть именно эту поставку → 10.</text>
</a>
<a href="#13"><title>Открыть раздел 13</title>
<rect x="1220" y="1422" width="460" height="184" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="1450.0" y="1479.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПЕРЕДАНА</text>
<text x="1450.0" y="1507.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">История отгрузки сохраняется.</text>
<text x="1450.0" y="1535.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Повторная печать этикеток → 13.</text>
<text x="1450.0" y="1563.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не передавать снова.</text>
</a>
<rect x="2930" y="1360" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="3160.0" y="1417.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">РЕДАКТИРОВАТЬ ОСТАТКИ</text>
<text x="3160.0" y="1445.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Код, адрес, количество.</text>
<text x="3160.0" y="1473.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">«шт.» отдельно, сетка не скачет.</text>
<text x="3160.0" y="1501.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Код/адрес — локальные данные</text>
<text x="3160.0" y="1529.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">supply.</text>
<polygon points="3160.0,1692 3390,1802.0 3160.0,1912 2930,1802.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="3160.0" y="1795.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Есть право</text>
<text x="3160.0" y="1823.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">изменения остатков?</text>
<rect x="3006.6666666666665" y="2178" width="460" height="184" rx="14" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="3236.6666666666665" y="2235.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ТОЛЬКО ПРОСМОТР</text>
<text x="3236.6666666666665" y="2263.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Значения видны, редактирование</text>
<text x="3236.6666666666665" y="2291.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">заблокировано.</text>
<text x="3236.6666666666665" y="2319.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Причина доступна пользователю.</text>
<rect x="2446.6666666666665" y="2178" width="460" height="268" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2676.6666666666665" y="2235.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОХРАНИТЬ ИЗМЕНЕНИЕ</text>
<text x="2676.6666666666665" y="2263.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверить число, версию и</text>
<text x="2676.6666666666665" y="2291.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">разрешённый склад.</text>
<text x="2676.6666666666665" y="2319.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Количество → WB PUT и контроль</text>
<text x="2676.6666666666665" y="2347.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">чтением.</text>
<text x="2676.6666666666665" y="2375.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Код / адрес → база supply; количества</text>
<text x="2676.6666666666665" y="2403.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">от импорта размещения не меняются.</text>
<rect x="70" y="280" width="460" height="240" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="300.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОБЩИЙ ВИД ТАБЛИЦ</text>
<text x="300.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ровная подсветка всей строки,</text>
<text x="300.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">фиксированные колонки, длинные</text>
<text x="300.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">названия переносятся.</text>
<text x="300.0" y="449.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Серое окончание без «Показано N</text>
<text x="300.0" y="477.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">позиций».</text>
<rect x="2370" y="1000" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2600.0" y="1057.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЭКСПОРТ ОСТАТКОВ</text>
<text x="2600.0" y="1085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">CSV по разрешённому кабинету/складу</text>
<text x="2600.0" y="1113.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">и текущему фильтру.</text>
<text x="2600.0" y="1141.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Другие склады не попадают в файл.</text>
<rect x="1810" y="640" width="460" height="240" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="2040.0" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">РАЗМЕЩЕНИЕ ИЗ ТАБЛИЦЫ</text>
<text x="2040.0" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Точное сопоставление баркода и</text>
<text x="2040.0" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">карточки/размера; только нужный</text>
<text x="2040.0" y="781.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">кабинет и склад.</text>
<text x="2040.0" y="809.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Неоднозначное не подставлять. Бэкап</text>
<text x="2040.0" y="837.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">и контроль неизменности количества.</text>
<rect x="1810" y="1000" width="460" height="240" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="2040.0" y="1057.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">НОВЫЕ ПОЗИЦИИ КАТАЛОГА</text>
<text x="2040.0" y="1085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Разовый перенос не равен постоянной</text>
<text x="2040.0" y="1113.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">синхронизации с Google Sheets.</text>
<text x="2040.0" y="1141.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Товары, не найденные при импорте,</text>
<text x="2040.0" y="1169.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">требуют отдельного повторного</text>
<text x="2040.0" y="1197.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сопоставления.</text>
<text x="70" y="2546" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Открытая поставка доступна по названию и статусу «На сборке». Старые записи без warehouse_id определяются по единственному складу сохранённых заказов; неизвестные значения не придумываются.</text>
