<path d="M 300 2442 L 300 2562" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="935.6666666666666" y="1778" width="57" height="30" rx="4" fill="white"/>
<text x="964.1666666666666" y="1800" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Нет</text>
<rect x="329.66666666666663" y="1778" width="49" height="30" rx="4" fill="white"/>
<text x="354.16666666666663" y="1800" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Да</text>
<rect x="223.33333333333331" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="453.3333333333333" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОЗДАТЬ СЧЁТ</text>
<text x="453.3333333333333" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Склад, дата, номер, вид операции,</text>
<text x="453.3333333333333" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">описание, контрагент, сумма, срок</text>
<text x="453.3333333333333" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">оплаты, документы.</text>
<rect x="223.33333333333331" y="584" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="453.3333333333333" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СЧЕТА КЛИЕНТАМ</text>
<text x="453.3333333333333" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только ожидающие оплаты.</text>
<text x="453.3333333333333" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сумма выставленных / ожидающих за</text>
<text x="453.3333333333333" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">выбранные даты.</text>
<rect x="223.33333333333331" y="888" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="453.3333333333333" y="945.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОТМЕТИТЬ ОПЛАТУ</text>
<text x="453.3333333333333" y="973.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Открывается окно подтверждения с</text>
<text x="453.3333333333333" y="1001.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">данными счёта.</text>
<rect x="223.33333333333331" y="1164" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="453.3333333333333" y="1221.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПРИКРЕПИТЬ ЧЕК</text>
<text x="453.3333333333333" y="1249.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Обязательный файл или фото.</text>
<text x="453.3333333333333" y="1277.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверить загрузку, тип и размер.</text>
<polygon points="453.3333333333333,1440 683.3333333333333,1550.0 453.3333333333333,1660 223.33333333333331,1550.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="453.3333333333333" y="1543.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Чек загружен</text>
<text x="453.3333333333333" y="1571.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">и данные корректны?</text>
<rect x="706.6666666666666" y="1926" width="460" height="156" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="936.6666666666666" y="1983.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">НЕТ ЧЕКА / СБОЙ ЗАГРУЗКИ</text>
<text x="936.6666666666666" y="2011.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Счёт остаётся неоплаченным.</text>
<text x="936.6666666666666" y="2039.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Показать ошибку возле поля.</text>
<rect x="146.66666666666666" y="1926" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666663" y="1983.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОДТВЕРДИТЬ ОПЛАТУ</text>
<text x="376.66666666666663" y="2011.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Одновременно отметить счёт</text>
<text x="376.66666666666663" y="2039.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">оплаченным и создать доход по этому</text>
<text x="376.66666666666663" y="2067.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">счёту.</text>
<text x="376.66666666666663" y="2095.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Повтор не создаёт второй доход.</text>
<rect x="630" y="2258" width="460" height="184" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="860.0" y="2315.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ДОХОД → 15</text>
<text x="860.0" y="2343.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Дата оплаты, вид операции счёта,</text>
<text x="860.0" y="2371.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">контрагент, сумма и чек.</text>
<text x="860.0" y="2399.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Виден при соответствующем периоде.</text>
<rect x="70" y="2258" width="460" height="184" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="300.0" y="2315.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">УХОДИТ ИЗ ОЖИДАЮЩИХ</text>
<text x="300.0" y="2343.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">История счёта и документы</text>
<text x="300.0" y="2371.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сохраняются.</text>
<text x="300.0" y="2399.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Это не удаление счёта из базы.</text>
<rect x="146.66666666666666" y="2562" width="460" height="184" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="376.66666666666663" y="2619.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ИСПРАВИТЬ / УДАЛИТЬ</text>
<text x="376.66666666666663" y="2647.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Связанные доход и счёт</text>
<text x="376.66666666666663" y="2675.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">корректировать согласованно, с</text>
<text x="376.66666666666663" y="2703.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подтверждением и журналом.</text>
<text x="70" y="2928" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>