<svg xmlns="http://www.w3.org/2000/svg" width="1609" height="3584" viewBox="0 0 1609 3584">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="1609" height="3584" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 22</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">22 · Ozon: подключение, склады и отправления FBS</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Владелец, фулфилмент и сотрудники с просмотром</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Реализован первый этап. Реальный кабинет требует ключей пользователя; контракт и сценарии проверены изолированными тестами.</text>
<path d="M 955.3333333333334 464 L 955.3333333333334 584" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 955.3333333333334 768 L 955.3333333333334 888" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 955.3333333333334 1100 L 955.3333333333334 1220" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1070.3333333333335 1100 L 1070.3333333333335 1138 L 1537.3333333333335 1138 L 1537.3333333333335 2970 L 530 2970 L 530 3026" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 955.3333333333334 1432 L 955.3333333333334 1552" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 415 3026 L 415 2944 L 1508.3333333333335 2944 L 1508.3333333333335 1802 L 1093.3333333333335 1802 L 1093.3333333333335 1764" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 817.3333333333334 1764 L 817.3333333333334 1802 L 492.33333333333337 1802 L 492.33333333333337 1884" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1001.3333333333334 1764 L 1001.3333333333334 1828 L 1240.3333333333335 1828 L 1240.3333333333335 1884" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 840.3333333333334 1100 L 840.3333333333334 1138 L 223.33333333333334 1138 L 223.33333333333334 2216" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 909.3333333333334 1764 L 909.3333333333334 2134 L 376.6666666666667 2134 L 376.6666666666667 2216" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 2428 L 300 2548" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 2760 L 300 3026" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1240.3333333333335 2096 L 1240.3333333333335 2548" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="132.33333333333334" y="1643" width="93" height="30" rx="4" fill="white"/>
<text x="178.83333333333334" y="1665" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Ошибка</text>
<rect x="818.3333333333334" y="1975" width="93" height="30" rx="4" fill="white"/>
<text x="864.8333333333334" y="1997" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Ошибка</text>
<rect x="168" y="2878" width="134" height="30" rx="4" fill="white"/>
<text x="235.0" y="2900" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">После паузы</text>
<rect x="1155.3333333333335" y="2307" width="87" height="30" rx="4" fill="white"/>
<text x="1198.8333333333335" y="2329" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Сборка</text>
<rect x="725.3333333333334" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="955.3333333333334" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">НАСТРОЙКИ → МАГАЗИНЫ</text>
<text x="955.3333333333334" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Выбрать Ozon → Client ID + API-ключ.</text>
<text x="955.3333333333334" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ключ вводится скрыто и не</text>
<text x="955.3333333333334" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сохраняется в браузере.</text>
<rect x="725.3333333333334" y="584" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="955.3333333333334" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЗАЩИТА КАБИНЕТА</text>
<text x="955.3333333333334" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Client ID нормализуется, один кабинет</text>
<text x="955.3333333333334" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">учитывается в общей подписке. Пара</text>
<text x="955.3333333333334" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Client ID/ключ шифруется на сервере.</text>
<rect x="725.3333333333334" y="888" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="955.3333333333334" y="945.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПРОВЕРИТЬ ПОДКЛЮЧЕНИЕ</text>
<text x="955.3333333333334" y="973.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">POST /v1/seller/info → название</text>
<text x="955.3333333333334" y="1001.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">магазина. Неверный начальный ключ</text>
<text x="955.3333333333334" y="1029.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">можно заменить; Client ID остаётся</text>
<text x="955.3333333333334" y="1057.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">прежним.</text>
<rect x="725.3333333333334" y="1220" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="955.3333333333334" y="1277.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СКЛАДЫ FBS</text>
<text x="955.3333333333334" y="1305.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">POST /v2/warehouse/list, limit 200 +</text>
<text x="955.3333333333334" y="1333.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">cursor. rFBS исключены. Склады</text>
<text x="955.3333333333334" y="1361.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">доступны в фильтре и в привязках</text>
<text x="955.3333333333334" y="1389.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сотрудников.</text>
<rect x="185" y="3026" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="415.0" y="3083.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОБЩАЯ ОЧЕРЕДЬ КАБИНЕТА</text>
<text x="415.0" y="3111.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Фоновое обновление и ручной запуск.</text>
<text x="415.0" y="3139.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Совместные обращения сотрудников</text>
<text x="415.0" y="3167.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">объединяются; пауза 429 сохраняется.</text>
<rect x="725.3333333333334" y="1552" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="955.3333333333334" y="1609.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">POST /v4/posting/fbs/list</text>
<text x="955.3333333333334" y="1637.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Первый импорт за 30 дней, limit 100 +</text>
<text x="955.3333333333334" y="1665.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">cursor, корневой postings без result.</text>
<text x="955.3333333333334" y="1693.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Далее изменения с перекрытием;</text>
<text x="955.3333333333334" y="1721.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ручной запрос полнее.</text>
<rect x="262.33333333333337" y="1884" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="492.33333333333337" y="1941.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПРАВА И ДАННЫЕ</text>
<text x="492.33333333333337" y="1969.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только назначенный склад; доступ</text>
<text x="492.33333333333337" y="1997.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сотрудника по подписке организации.</text>
<text x="492.33333333333337" y="2025.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сохраняются нужные поля заказа без</text>
<text x="492.33333333333337" y="2053.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">адреса/телефона покупателя.</text>
<rect x="70" y="2216" width="460" height="212" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="300.0" y="2273.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОШИБКА API</text>
<text x="300.0" y="2301.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Неверный ключ/права, 429, тайм-аут</text>
<text x="300.0" y="2329.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">или неполный ответ: сохранённые</text>
<text x="300.0" y="2357.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отправления доступны, частичная</text>
<text x="300.0" y="2385.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">страница не публикуется.</text>
<rect x="70" y="2548" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="300.0" y="2605.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОВТОР</text>
<text x="300.0" y="2633.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">429 не обходится кнопкой обновления.</text>
<text x="300.0" y="2661.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Отмена/изменение состава приходят</text>
<text x="300.0" y="2689.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">обновлением статуса; история не</text>
<text x="300.0" y="2717.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">удаляется.</text>
<rect x="1010.3333333333334" y="1884" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1240.3333333333335" y="1941.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОТПРАВЛЕНИЯ В СТИЛЕ SUPPLY</text>
<text x="1240.3333333333335" y="1969.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Номер, товары/артикулы/SKU,</text>
<text x="1240.3333333333335" y="1997.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">количества, статус, склад, даты и</text>
<text x="1240.3333333333335" y="2025.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">scanit. Поиск, фильтры склада/статуса</text>
<text x="1240.3333333333335" y="2053.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">и страницы.</text>
<rect x="1010.3333333333334" y="2548" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1240.3333333333335" y="2605.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СБОРКА И КИЗ</text>
<text x="1240.3333333333335" y="2633.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сканирование и сохранение КИЗ у</text>
<text x="1240.3333333333335" y="2661.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">экземпляров Ozon реализованы в</text>
<text x="1240.3333333333335" y="2689.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">главе 23. Этикетки, документы отгрузки</text>
<text x="1240.3333333333335" y="2717.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">и остатки — следующие этапы.</text>
<text x="70" y="3310" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Действующая документация Ozon Seller API проверена в браузере: SellerAPI_SellerInfo, WarehouseListV2, PostingFbsList. Тестовые ответы</text>
<text x="70" y="3338" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">не подменяют проверку пользовательского кабинета. API-ключи и персональные данные в схеме отсутствуют. Автоматически читаются атрибут</text>
<text x="70" y="3366" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">маркировки 23536 и ТН ВЭД 22232 по SKU: пакетами по 100, кеш сутки, ручное обновление перечитывает. Нет/неоднозначный признак —</text>
<text x="70" y="3394" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">неизвестно; ошибка не стирает сохранённые данные. Это признак карточки, а не проверка конкретного КИЗ и не требование передачи кода</text>
<text x="70" y="3422" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">по заказу. Уточнение интерфейса: признаки маркировки и ТН ВЭД скрыты из списка товаров. Для будущей сборки согласован сценарий WB:</text>
<text x="70" y="3450" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">система сама запрашивает КИЗ после скана, только когда он нужен; сборка Ozon пока не реализована. Сборка и запись КИЗ теперь</text>
<text x="70" y="3478" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">подключены — см. главу 23. Печать этикеток, многокоробочная сборка, отгрузочные документы и остатки Ozon остаются отдельными этапами.</text>
<text x="70" y="3506" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Печать этикеток Ozon подключена в главе 24; документы перевозки и остатки остаются отдельными этапами.</text>
<text x="70" y="3556" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>