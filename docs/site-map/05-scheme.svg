<svg xmlns="http://www.w3.org/2000/svg" width="1797" height="3920" viewBox="0 0 1797 3920">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="1797" height="3920" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 05</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">05 · Клиент выдаёт доступ / ФФ подключает клиента</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Клиент → сервер → владелец ФФ</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Одноразовые коды и серверные ограничения есть.</text>
<path d="M 783.3333333333333 436 L 783.3333333333333 556" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 783.3333333333333 740 L 783.3333333333333 860" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 1072 L 860 1206" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1420 1404 L 1420 1524" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1420 1680 L 1420 1877.3333333333335" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 1390 L 860 1718 L 1266.6666666666665 1718 L 1266.6666666666665 1877.3333333333335" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1266.6666666666665 2186.6666666666665 L 1266.6666666666665 2302 L 860 2302 L 860 2530" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1420 2186.6666666666665 L 1420 2544" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1420 2728 L 1420 2862" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1343.3333333333333 3018 L 1343.3333333333333 3056 L 936.6666666666666 3056 L 936.6666666666666 3152" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1496.6666666666667 3018 L 1496.6666666666665 3138" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1496.6666666666665 3350 L 1496.6666666666665 3470" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 706.6666666666666 1072 L 706.6666666666666 1110 L 300 1110 L 300 1192" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 936.6666666666666 3336 L 936.6666666666666 3470" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="698" y="1587" width="164" height="30" rx="4" fill="white"/>
<text x="780.0" y="1609" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Полученный код</text>
<rect x="805" y="2382" width="57" height="30" rx="4" fill="white"/>
<text x="833.5" y="2404" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Нет</text>
<rect x="1419" y="2382" width="49" height="30" rx="4" fill="white"/>
<text x="1443.5" y="2404" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Да</text>
<rect x="553.3333333333333" y="280" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="783.3333333333333" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">КЛИЕНТ</text>
<text x="783.3333333333333" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Свой магазин уже подключён → 04.</text>
<text x="783.3333333333333" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Настройки → Доступ фулфилменту.</text>
<rect x="553.3333333333333" y="556" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="783.3333333333333" y="613.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Выбрать кабинет и ОДИН склад WB</text>
<text x="783.3333333333333" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Если магазинов несколько, выбрать</text>
<text x="783.3333333333333" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">нужный.</text>
<text x="783.3333333333333" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Без выбора маркетплейса повторно.</text>
<rect x="553.3333333333333" y="860" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="783.3333333333333" y="917.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Создать одноразовый код</text>
<text x="783.3333333333333" y="945.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Связан с владельцем, кабинетом и</text>
<text x="783.3333333333333" y="973.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">складом.</text>
<text x="783.3333333333333" y="1001.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Срок 24 часа.</text>
<text x="783.3333333333333" y="1029.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">В базе только хеш кода.</text>
<rect x="630" y="1206" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="1263.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Скопировать код и передать ФФ</text>
<text x="860.0" y="1291.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Пользователь передаёт код сам.</text>
<text x="860.0" y="1319.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сайт не отправляет</text>
<text x="860.0" y="1347.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">письмо-приглашение.</text>
<rect x="1190" y="1248" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1420.0" y="1305.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ВЛАДЕЛЕЦ ФФ</text>
<text x="1420.0" y="1333.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Активная подписка → 02.</text>
<text x="1420.0" y="1361.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Настройки → Клиенты.</text>
<rect x="1190" y="1524" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1420.0" y="1581.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">«Добавить клиента»</text>
<text x="1420.0" y="1609.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ввести только одноразовый код.</text>
<text x="1420.0" y="1637.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Email и выбор маркетплейса не нужны.</text>
<polygon points="1343.3333333333333,1800 1573.3333333333333,2032.0 1343.3333333333333,2264 1113.3333333333333,2032.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="1343.3333333333333" y="1955.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Проверка сервера</text>
<text x="1343.3333333333333" y="1983.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Код существует, не истёк</text>
<text x="1343.3333333333333" y="2011.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">и не использован?</text>
<text x="1343.3333333333333" y="2039.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не свой кабинет? Нет</text>
<text x="1343.3333333333333" y="2067.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">дубля?</text>
<text x="1343.3333333333333" y="2095.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Лимит подписки</text>
<text x="1343.3333333333333" y="2123.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">позволяет?</text>
<rect x="630" y="2530" width="460" height="212" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="860.0" y="2587.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Код неверный / истёк / уже</text>
<text x="860.0" y="2615.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">использован</text>
<text x="860.0" y="2643.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Понятная причина.</text>
<text x="860.0" y="2671.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Кабинет не подключается в статусе</text>
<text x="860.0" y="2699.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">«ожидает» навсегда.</text>
<rect x="1190" y="2544" width="460" height="184" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="1420.0" y="2601.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Атомарно погасить код</text>
<text x="1420.0" y="2629.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Создать принятый доступ ФФ.</text>
<text x="1420.0" y="2657.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Доступ только к выбранному складу.</text>
<text x="1420.0" y="2685.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">API-ключ клиенту ФФ не раскрывается.</text>
<a href="#06"><title>Открыть раздел 06</title>
<rect x="1190" y="2862" width="460" height="156" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="1420.0" y="2919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">06 Связать с физическим складом ФФ</text>
<text x="1420.0" y="2947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Кабинет клиента + warehouseId WB</text>
<text x="1420.0" y="2975.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">→ конкретный склад, созданный ФФ.</text>
</a>
<a href="#08"><title>Открыть раздел 08</title>
<rect x="706.6666666666666" y="3152" width="460" height="184" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="936.6666666666666" y="3209.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ФФ: 08 Обзор → 09 Заказы</text>
<text x="936.6666666666666" y="3237.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только переданный склад.</text>
<text x="936.6666666666666" y="3265.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сотрудники видят его лишь через</text>
<text x="936.6666666666666" y="3293.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">назначение → 07.</text>
</a>
<a href="#08"><title>Открыть раздел 08</title>
<rect x="1266.6666666666665" y="3138" width="460" height="212" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="1496.6666666666665" y="3195.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Клиент: 08 Обзор</text>
<text x="1496.6666666666665" y="3223.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Его кабинет и склад WB.</text>
<text x="1496.6666666666665" y="3251.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Название физического склада ФФ.</text>
<text x="1496.6666666666665" y="3279.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Без собственной подписки обзор</text>
<text x="1496.6666666666665" y="3307.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">доступен.</text>
</a>
<rect x="1266.6666666666665" y="3470" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1496.6666666666665" y="3527.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОТОЗВАТЬ ДОСТУП</text>
<text x="1496.6666666666665" y="3555.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Клиент может отозвать в любой</text>
<text x="1496.6666666666665" y="3583.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">момент.</text>
<text x="1496.6666666666665" y="3611.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ФФ и его сотрудники теряют</text>
<text x="1496.6666666666665" y="3639.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">разрешение.</text>
<text x="1496.6666666666665" y="3667.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Данные владельца остаются.</text>
<rect x="70" y="1192" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="300.0" y="1249.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">НОВЫЙ КОД</text>
<text x="300.0" y="1277.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Старый неиспользованный код</text>
<text x="300.0" y="1305.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отменяется.</text>
<text x="300.0" y="1333.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Уже принятый доступ живёт до</text>
<text x="300.0" y="1361.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отдельного отзыва.</text>
<rect x="706.6666666666666" y="3470" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="936.6666666666666" y="3527.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОТКЛЮЧЕНИЕ ФФ</text>
<text x="936.6666666666666" y="3555.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ФФ отключил клиента или его подписка</text>
<text x="936.6666666666666" y="3583.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">истекла → рабочий доступ закрыт.</text>
<text x="936.6666666666666" y="3611.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не удалять собственный магазин</text>
<text x="936.6666666666666" y="3639.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">клиента.</text>
<text x="70" y="3892" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>