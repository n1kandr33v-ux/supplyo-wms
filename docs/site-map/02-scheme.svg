<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="2896" viewBox="0 0 1720 2896">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="1720" height="2896" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 02</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">02 · Подписка, лимиты и продление</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Самостоятельный продавец / владелец ФФ</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Тестовая активация есть. Настоящая оплата через банк: проект.</text>
<path d="M 860 436 L 860 556" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 936.6666666666667 796 L 936.6666666666667 834 L 1113.3333333333335 834 L 1113.3333333333335 1062" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 783.3333333333334 796 L 783.3333333333334 1422" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1113.3333333333335 1302 L 1113.3333333333335 1644 L 936.6666666666667 1644 L 936.6666666666667 1726" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 783.3333333333334 1606 L 783.3333333333334 1726" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 745 1966 L 745 2004 L 300 2004 L 300 2086" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 975 1966 L 975 2004 L 1496.6666666666667 2004 L 1496.6666666666667 2418" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 1966 L 860 2086" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 975 2298 L 975 2336 L 1343.3333333333333 2336 L 1343.3333333333333 2418" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 2298 L 860 2418" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 745 2298 L 745 2336 L 300 2336 L 300 2418" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1112.3333333333335" y="914" width="249" height="30" rx="4" fill="white"/>
<text x="1236.8333333333335" y="936" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">После подключения банка</text>
<rect x="595.3333333333334" y="914" width="190" height="30" rx="4" fill="white"/>
<text x="690.3333333333334" y="936" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Тестовый сценарий</text>
<rect x="1112.3333333333335" y="1499" width="206" height="30" rx="4" fill="white"/>
<text x="1215.3333333333335" y="1521" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Подтверждён платёж</text>
<rect x="630" y="280" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Настройки → Подписка</text>
<text x="860.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Текущий тариф, статус, срок</text>
<text x="860.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">«Добавлено X из N кабинетов».</text>
<rect x="630" y="556" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="613.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Выбрать тариф</text>
<text x="860.0" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Соло: 1 / 1 990 ₽ в месяц</text>
<text x="860.0" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Старт: до 5 / 4 990 ₽</text>
<text x="860.0" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Бизнес: до 25 / 8 990 ₽</text>
<text x="860.0" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Профи: до 50 / 14 990 ₽</text>
<text x="860.0" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Более 50: по согласованию.</text>
<rect x="883.3333333333335" y="1062" width="460" height="240" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="1113.3333333333335" y="1119.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЦЕЛЕВАЯ ОПЛАТА</text>
<text x="1113.3333333333335" y="1147.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Создать платёж → платёжная страница</text>
<text x="1113.3333333333335" y="1175.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">→ сервер проверяет уведомление</text>
<text x="1113.3333333333335" y="1203.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">банка.</text>
<text x="1113.3333333333335" y="1231.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Один возврат браузера не</text>
<text x="1113.3333333333335" y="1259.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подтверждает оплату.</text>
<rect x="553.3333333333334" y="1422" width="460" height="184" rx="14" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="783.3333333333334" y="1479.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СЕЙЧАС ДЛЯ ТЕСТОВ</text>
<text x="783.3333333333334" y="1507.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">«Активировать без оплаты»</text>
<text x="783.3333333333334" y="1535.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Тестовая подписка на 30 дней.</text>
<text x="783.3333333333334" y="1563.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Деньги не списываются.</text>
<rect x="630" y="1726" width="460" height="240" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="860.0" y="1783.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Подписка активна</text>
<text x="860.0" y="1811.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Работа со своими заказами ·</text>
<text x="860.0" y="1839.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подключение клиентов · склады ·</text>
<text x="860.0" y="1867.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сотрудники · учёт.</text>
<text x="860.0" y="1895.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Права сотрудника проверяются</text>
<text x="860.0" y="1923.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отдельно.</text>
<rect x="70" y="2086" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="300.0" y="2143.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Лимит кабинетов</text>
<text x="300.0" y="2171.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Считаются уникальные свои и</text>
<text x="300.0" y="2199.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подключённые клиентские кабинеты.</text>
<text x="300.0" y="2227.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Несколько складов одного кабинета не</text>
<text x="300.0" y="2255.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">равны нескольким API-ключам.</text>
<rect x="1190" y="2418" width="460" height="212" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="1420.0" y="2475.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Продлить / сменить тариф</text>
<text x="1420.0" y="2503.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Показать срок и новый лимит.</text>
<text x="1420.0" y="2531.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Целевая логика: сохранить</text>
<text x="1420.0" y="2559.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">оплаченные дни; не отключать лишние</text>
<text x="1420.0" y="2587.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">кабинеты молча.</text>
<rect x="630" y="2086" width="460" height="212" rx="14" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="860.0" y="2143.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Подписка истекла</text>
<text x="860.0" y="2171.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Рабочие действия ВМС закрыты.</text>
<text x="860.0" y="2199.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">API-ключи, история и документы не</text>
<text x="860.0" y="2227.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">удаляются.</text>
<text x="860.0" y="2255.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Настройки и профиль остаются.</text>
<rect x="630" y="2418" width="460" height="268" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="860.0" y="2475.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">БЕЗ СОБСТВЕННОЙ ПОДПИСКИ</text>
<text x="860.0" y="2503.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Можно добавить свой API и выдать</text>
<text x="860.0" y="2531.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">доступ ФФ.</text>
<text x="860.0" y="2559.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Можно смотреть свой обзор</text>
<text x="860.0" y="2587.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подключённых ФФ.</text>
<text x="860.0" y="2615.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Нельзя работать как платный оператор</text>
<text x="860.0" y="2643.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ВМС.</text>
<rect x="70" y="2418" width="460" height="184" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="300.0" y="2475.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Сотруднику не нужна личная подписка</text>
<text x="300.0" y="2503.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Доступ по назначению на склад.</text>
<text x="300.0" y="2531.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ограничение при истечении подписки</text>
<text x="300.0" y="2559.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">работодателя.</text>
<text x="70" y="2868" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>