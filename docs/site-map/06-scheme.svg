<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="3260" viewBox="0 0 1720 3260">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="1720" height="3260" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 06</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">06 · Физические склады и привязка к WB</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Владелец ФФ / сотрудник с правом управления</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Склады и серверные привязки есть. Не путать два вида склада.</text>
<path d="M 1381.6666666666667 464 L 1381.6666666666667 1112" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 821.6666666666667 464 L 821.6666666666667 584.0" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1381.6666666666667 1296 L 1381.6666666666667 1416" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 821.6666666666667 992.0 L 821.6666666666667 1334 L 1228.3333333333333 1334 L 1228.3333333333333 1416" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1305 1656 L 1305 1720 L 860 1720 L 860 1776" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1190 1656 L 1190 1694 L 300 1694 L 300 1776" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1420 1656 L 1420 1776" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 783.3333333333334 1988 L 783.3333333333334 2026 L 376.66666666666674 2026 L 376.66666666666674 2108" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 936.6666666666667 1988 L 936.6666666666667 2108.0" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860.0000000000001 2494.6666666666665 L 860 2610 L 453.33333333333337 2610 L 453.33333333333337 2838" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1013.3333333333335 2494.6666666666665 L 1013.3333333333334 2838" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="664.6666666666667" y="1189" width="159" height="30" rx="4" fill="white"/>
<text x="744.1666666666667" y="1211" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Выбран нужный</text>
<rect x="218.33333333333337" y="2690" width="237" height="30" rx="4" fill="white"/>
<text x="336.83333333333337" y="2712" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Есть блокирующие связи</text>
<rect x="1012.3333333333334" y="2690" width="177" height="30" rx="4" fill="white"/>
<text x="1100.8333333333335" y="2712" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Связи разрешены</text>
<rect x="1151.6666666666667" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1381.6666666666667" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ФИЗИЧЕСКИЙ СКЛАД ФФ</text>
<text x="1381.6666666666667" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Название, город, адрес.</text>
<text x="1381.6666666666667" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Например «ОптимумПак · Казань».</text>
<text x="1381.6666666666667" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Создаётся в supply.</text>
<rect x="591.6666666666667" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="821.6666666666667" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СКЛАД ПРОДАВЦА WB</text>
<text x="821.6666666666667" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">warehouseId + название.</text>
<text x="821.6666666666667" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Приходит из API магазина.</text>
<text x="821.6666666666667" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Клиент выдаёт доступ к нему через 05.</text>
<rect x="1151.6666666666667" y="1112" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1381.6666666666667" y="1169.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Аккаунт → Склады → Добавить склад</text>
<text x="1381.6666666666667" y="1197.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Название · город · адрес.</text>
<text x="1381.6666666666667" y="1225.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сотрудники добавляются отдельно →</text>
<text x="1381.6666666666667" y="1253.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">07.</text>
<rect x="1075" y="1416" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1305.0" y="1473.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПРИВЯЗКА</text>
<text x="1305.0" y="1501.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Кабинет + склад WB + принятый</text>
<text x="1305.0" y="1529.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">доступ</text>
<text x="1305.0" y="1557.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">→ один физический склад ФФ.</text>
<text x="1305.0" y="1585.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Один физический склад может</text>
<text x="1305.0" y="1613.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">обслуживать несколько клиентов.</text>
<polygon points="821.6666666666667,584 1051.6666666666667,788.0 821.6666666666667,992 591.6666666666667,788.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="821.6666666666667" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Несколько физических</text>
<text x="821.6666666666667" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">складов?</text>
<text x="821.6666666666667" y="781.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Нельзя выбирать</text>
<text x="821.6666666666667" y="809.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">случайный.</text>
<text x="821.6666666666667" y="837.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Администратор явно</text>
<text x="821.6666666666667" y="865.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">указывает привязку.</text>
<rect x="630" y="1776" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="1833.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Карточка склада</text>
<text x="860.0" y="1861.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Название · город · адрес</text>
<text x="860.0" y="1889.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Карандаш только для адреса</text>
<text x="860.0" y="1917.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сотрудники с доступом</text>
<text x="860.0" y="1945.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Удаление через подтверждение</text>
<a href="#07"><title>Открыть раздел 07</title>
<rect x="70" y="1776" width="460" height="212" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="300.0" y="1833.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">07 Назначить сотрудников</text>
<text x="300.0" y="1861.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Права распространяются на</text>
<text x="300.0" y="1889.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">WB-привязки этого физического</text>
<text x="300.0" y="1917.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">склада.</text>
<text x="300.0" y="1945.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не на все кабинеты организации.</text>
</a>
<a href="#08"><title>Открыть раздел 08</title>
<rect x="1190" y="1776" width="460" height="184" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="1420.0" y="1833.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">08 Обзор</text>
<text x="1420.0" y="1861.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ФФ: все доступные собственные и</text>
<text x="1420.0" y="1889.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">клиентские складские контексты.</text>
<text x="1420.0" y="1917.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Клиент: только его склады у ФФ.</text>
</a>
<rect x="146.66666666666674" y="2108" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666674" y="2165.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Редактировать адрес</text>
<text x="376.66666666666674" y="2193.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Отдельное поле / окно.</text>
<text x="376.66666666666674" y="2221.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Изменение адреса не меняет</text>
<text x="376.66666666666674" y="2249.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">warehouseId WB.</text>
<polygon points="936.6666666666667,2108 1166.6666666666667,2340.0 936.6666666666667,2572 706.6666666666667,2340.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="936.6666666666667" y="2263.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Удалить склад?</text>
<text x="936.6666666666667" y="2291.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверить связанные</text>
<text x="936.6666666666667" y="2319.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">документы и</text>
<text x="936.6666666666667" y="2347.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сотрудников.</text>
<text x="936.6666666666667" y="2375.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Если есть записи учёта,</text>
<text x="936.6666666666667" y="2403.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сначала разрешить</text>
<text x="936.6666666666667" y="2431.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">связи.</text>
<rect x="223.33333333333337" y="2838" width="460" height="184" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="453.33333333333337" y="2895.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Удаление заблокировано</text>
<text x="453.33333333333337" y="2923.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не оставлять учёт и доступы без</text>
<text x="453.33333333333337" y="2951.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">склада.</text>
<text x="453.33333333333337" y="2979.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Показать связанные данные.</text>
<rect x="783.3333333333334" y="2838" width="460" height="212" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="1013.3333333333334" y="2895.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Подтвердить удаление</text>
<text x="1013.3333333333334" y="2923.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Убирается физический склад и его</text>
<text x="1013.3333333333334" y="2951.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">назначения.</text>
<text x="1013.3333333333334" y="2979.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сам магазин WB клиента не</text>
<text x="1013.3333333333334" y="3007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">удаляется.</text>
<text x="70" y="3150" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Привязки и ограничения склада работают также с кабинетами Ozon; идентичность — marketplace + кабинет + warehouseId.</text>
<text x="70" y="3232" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>