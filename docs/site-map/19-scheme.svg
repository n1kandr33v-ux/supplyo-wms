<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="3347" height="3740" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 19</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">19 · Что происходит за экраном: данные и ограничения</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Сервер / интеграции / рабочее место</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: База, очередь, лимиты, объединение КИЗ и ежедневный локальный бэкап работают. Распределённый limiter, полный аудит и внешний бэкап — планы.</text>
<path d="M 966.6666666666667 464 L 966.6666666666667 502 L 1297.6666666666665 502 L 1297.6666666666665 584" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1451 796 L 1451 834 L 3275.3333333333335 834 L 3275.3333333333335 2904 L 1043.3333333333335 2904 L 1043.3333333333333 2986" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
