<rect x="3191.3333333333335" y="2000" width="86" height="30" rx="4" fill="white"/>
<text x="3234.3333333333335" y="2022" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Чтение</text>
<rect x="3016.3333333333335" y="1055" width="222" height="30" rx="4" fill="white"/>
<text x="3127.3333333333335" y="1077" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Действие / обновление</text>
<rect x="2597" y="2000" width="172" height="30" rx="4" fill="white"/>
<text x="2683.0" y="2022" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Разрешён запрос</text>
<rect x="807" y="2838" width="85" height="30" rx="4" fill="white"/>
<text x="849.5" y="2860" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Запись</text>
<rect x="656.3333333333334" y="1401" width="159" height="30" rx="4" fill="white"/>
<text x="735.8333333333334" y="1423" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Свежие данные</text>
<rect x="1143.3333333333335" y="1055" width="101" height="30" rx="4" fill="white"/>
<text x="1193.8333333333335" y="1077" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Этикетка</text>
<rect x="660" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="890.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">БРАУЗЕР</text>
<text x="890.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Запрашивает экран / отправляет</text>
<text x="890.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">действие.</text>
<text x="890.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">API-ключи маркетплейса не получает.</text>
<rect x="1067.6666666666665" y="584" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1297.6666666666665" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СЕРВЕР SUPPLY</text>
<text x="1297.6666666666665" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сессия → права → кабинет → склад →</text>
<text x="1297.6666666666665" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">операция.</text>
<text x="1297.6666666666665" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Телефон читает те же разрешённые</text>
<text x="1297.6666666666665" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">данные, но отметки держит у себя.</text>
<rect x="736.6666666666666" y="2986" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="966.6666666666666" y="3043.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">БАЗА ДАННЫХ</text>
<text x="966.6666666666666" y="3071.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Пользователи, подписки, магазины,</text>
<text x="966.6666666666666" y="3099.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">склады, доступы, сотрудники, заказы,</text>
<text x="966.6666666666666" y="3127.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">поставки, КИЗ, печать, учёт и файлы.</text>
<rect x="2537" y="1310" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2767.0" y="1367.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОЧЕРЕДЬ ЗАДАЧ</text>
<text x="2767.0" y="1395.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Тип запроса + кабинет + нужный</text>
<text x="2767.0" y="1423.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ресурс.</text>
<text x="2767.0" y="1451.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Объединить одинаковые обновления,</text>
<text x="2767.0" y="1479.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сохранить состояние задания.</text>
<rect x="2537" y="1642" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2767.0" y="1699.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">РАБОТАЮЩИЕ ЛИМИТЫ WB</text>
<text x="2767.0" y="1727.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Общий планировщик токена,</text>
<text x="2767.0" y="1755.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">интервалы и сохранённые паузы 429.</text>
<text x="2767.0" y="1783.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">КИЗ: ожидающие, пачки ≤100,</text>
<text x="2767.0" y="1811.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">объединение по кабинету; защита от</text>
<text x="2767.0" y="1839.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">старых revision.</text>
<rect x="2537" y="2148" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2767.0" y="2205.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">WILDBERRIES API</text>
<text x="2767.0" y="2233.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Новые заказы — фоновая</text>
<text x="2767.0" y="2261.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">синхронизация.</text>
<text x="2767.0" y="2289.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Стикеры — выбранные заказы</text>
<text x="2767.0" y="2317.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">поставки.</text>
<text x="2767.0" y="2345.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">КИЗ — только ожидающие проверки.</text>
<rect x="2460.3333333333335" y="950" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2690.3333333333335" y="1007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОБНОВЛЕНИЕ ЗАКАЗОВ</text>
<text x="2690.3333333333335" y="1035.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Фон: раз в 60 секунд без лишних</text>
<text x="2690.3333333333335" y="1063.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">уведомлений.</text>
<text x="2690.3333333333335" y="1091.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ручное действие пропускает обычный</text>
<text x="2690.3333333333335" y="1119.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">интервал, но не действительный 429 /</text>
<text x="2690.3333333333335" y="1147.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Retry-After.</text>
<rect x="660" y="2508" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="890.0" y="2565.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОБНОВИТЬ КЭШ / БАЗУ</text>
<text x="890.0" y="2593.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сохранить подтверждённый ответ →</text>
<text x="890.0" y="2621.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">обновить экран.</text>
<text x="890.0" y="2649.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">При сбое показать старые данные и</text>
<text x="890.0" y="2677.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">причину, не заменять нулями.</text>
<a href="#10"><title>Открыть раздел 10</title>
<rect x="914.3333333333334" y="1310" width="460" height="184" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="1144.3333333333335" y="1367.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПЕЧАТЬ — ОТДЕЛЬНЫЙ КАНАЛ</text>
<text x="1144.3333333333335" y="1395.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Браузер → локальный агент →</text>
<text x="1144.3333333333335" y="1423.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">принтер.</text>
<text x="1144.3333333333335" y="1451.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Результат задания → сервер → 10–12.</text>
</a>
<rect x="1340.3333333333335" y="950" width="460" height="184" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="1570.3333333333335" y="1007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЖУРНАЛ И НАДЁЖНОСТЬ</text>
<text x="1570.3333333333335" y="1035.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Кто / что / когда / какой склад.</text>
<text x="1570.3333333333335" y="1063.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Защита от повторной оплаты, двойной</text>
<text x="1570.3333333333335" y="1091.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">поставки и старого ответа КИЗ.</text>
<rect x="736.6666666666666" y="3290" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="966.6666666666666" y="3347.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЕЖЕДНЕВНЫЙ БЭКАП НА VPS</text>
<text x="966.6666666666666" y="3375.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">База + документы + ключ шифрования,</text>
<text x="966.6666666666666" y="3403.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">04:15 МСК, хранение 14 дней.</text>
<text x="966.6666666666666" y="3431.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Копия на независимый сервер и</text>
<text x="966.6666666666666" y="3459.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">проверка восстановления ещё не</text>
<text x="966.6666666666666" y="3487.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">завершены.</text>
<rect x="70" y="280" width="460" height="268" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="300.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СЕКРЕТЫ И ДОСТУП</text>
<text x="300.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ключи WB зашифрованы и не</text>
<text x="300.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">возвращаются frontend. Пароли scrypt,</text>
<text x="300.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сессии HttpOnly/Secure.</text>
<text x="300.0" y="449.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Авторизация и складские права</text>
<text x="300.0" y="477.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">действуют на каждом запросе;</text>
<text x="300.0" y="505.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">вложения изолированы.</text>
<rect x="1900.3333333333335" y="950" width="460" height="240" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="2130.3333333333335" y="1007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПУБЛИКАЦИЯ И ОТКАТ</text>
<text x="2130.3333333333335" y="1035.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверки → сборка → бэкап → новый</text>
<text x="2130.3333333333335" y="1063.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">каталог → SHA-256 → атомарное</text>
<text x="2130.3333333333335" y="1091.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">переключение.</text>
<text x="2130.3333333333335" y="1119.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Health и публичные файлы</text>
<text x="2130.3333333333335" y="1147.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">проверяются после активации.</text>
<text x="70" y="3630" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Ни карточка со статусом, ни успешная сборка проекта не доказывают физическую печать, реальное списание денег или наличие внешнего бэкапа.</text>
<text x="70" y="3712" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>