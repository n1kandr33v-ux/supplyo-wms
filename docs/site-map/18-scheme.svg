<svg xmlns="http://www.w3.org/2000/svg" width="2840" height="1732" viewBox="0 0 2840 1732">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="2840" height="1732" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 18</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">18 · Профиль, организация, подписка и выход</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Каждый зарегистрированный пользователь</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: В live-профиле есть просмотр ФИО/email, доступов и подписки. Полный редактор профиля/организации и безопасность ещё не перенесены из макета.</text>
<path d="M 2386.6666666666665 464 L 2386.6666666666665 584" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 2463.333333333333 768 L 2463.3333333333335 884 L 1980 884 L 1980 922" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 2310 768 L 2310 832 L 860 832 L 860 922" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 2233.333333333333 768 L 2233.3333333333335 806 L 300 806 L 300 922" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 2540 768 L 2540 922" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1980 1190 L 1980 1310" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 2386.6666666666665 768 L 2386.6666666666665 858 L 1420 858 L 1420 922" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 2233.3333333333335 464 L 2233.3333333333335 502 L 1826.6666666666667 502 L 1826.6666666666667 584" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="2080" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2310.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">МЕНЮ АККАУНТА ВНИЗУ СЛЕВА</text>
<text x="2310.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Открывается справа от панели.</text>
<text x="2310.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Профиль / склады / учёт / выйти — по</text>
<text x="2310.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">доступу.</text>
<rect x="2156.6666666666665" y="584" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2386.6666666666665" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">LIVE-ПРОФИЛЬ</text>
<text x="2386.6666666666665" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Просмотр ФИО, email, доступов</text>
<text x="2386.6666666666665" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сотрудника и статуса подписки.</text>
<text x="2386.6666666666665" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Переход к тарифу / подписке.</text>
<rect x="1750" y="922" width="460" height="268" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="1980.0" y="979.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОЛНЫЙ РЕДАКТОР ПРОФИЛЯ —</text>
<text x="1980.0" y="1007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ПЛАН</text>
<text x="1980.0" y="1035.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Поля телефона, Telegram, организации</text>
<text x="1980.0" y="1063.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">и безопасное изменение личных</text>
<text x="1980.0" y="1091.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">данных есть в макете.</text>
<text x="1980.0" y="1119.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">В рабочем экране пока только</text>
<text x="1980.0" y="1147.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">просмотр.</text>
<rect x="630" y="922" width="460" height="184" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="860.0" y="979.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОРГАНИЗАЦИЯ — ПЛАН</text>
<text x="860.0" y="1007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Название фулфилмента и ИНН.</text>
<text x="860.0" y="1035.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Полная форма макета не означает</text>
<text x="860.0" y="1063.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">готовый live-редактор.</text>
<a href="#02"><title>Открыть раздел 02</title>
<rect x="70" y="922" width="460" height="212" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="300.0" y="979.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">МОЯ ПОДПИСКА</text>
<text x="300.0" y="1007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Тариф, статус, срок действия,</text>
<text x="300.0" y="1035.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">кабинетов X из N.</text>
<text x="300.0" y="1063.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Без лимита сотрудников.</text>
<text x="300.0" y="1091.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Продлить / выбрать → 02.</text>
</a>
<rect x="2310" y="922" width="460" height="212" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="2540.0" y="979.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">БЕЗОПАСНОСТЬ</text>
<text x="2540.0" y="1007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Смена пароля: текущий → новый →</text>
<text x="2540.0" y="1035.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подтверждение.</text>
<text x="2540.0" y="1063.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Восстановление через проверенную</text>
<text x="2540.0" y="1091.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">почту — отдельный сценарий.</text>
<rect x="1750" y="1310" width="460" height="212" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="1980.0" y="1367.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОХРАНИТЬ НА СЕРВЕРЕ</text>
<text x="1980.0" y="1395.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверка значений и владельца</text>
<text x="1980.0" y="1423.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">профиля.</text>
<text x="1980.0" y="1451.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Email влияет на привязку сотрудника:</text>
<text x="1980.0" y="1479.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">нужна безопасная процедура смены.</text>
<rect x="1190" y="922" width="460" height="212" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="1420.0" y="979.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЧАСОВОЙ ПОЯС</text>
<text x="1420.0" y="1007.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Удобный список с читаемым</text>
<text x="1420.0" y="1035.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">выбранным значением.</text>
<text x="1420.0" y="1063.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Единое применение ко времени сайта</text>
<text x="1420.0" y="1091.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">нужно довести.</text>
<rect x="1596.6666666666667" y="584" width="460" height="184" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="1826.6666666666667" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ВЫЙТИ</text>
<text x="1826.6666666666667" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Завершить серверную сессию → 01</text>
<text x="1826.6666666666667" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Вход.</text>
<text x="1826.6666666666667" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Данные и подписка не удаляются.</text>
<text x="70" y="1622" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Не считать общий компонент PersonalAccount доказательством готовности live-редактора профиля: сейчас он используется для складов. Смена/восстановление пароля и подтверждение почты остаются планом. Подписка в аккаунте: название тарифа по лимиту,</text>
<text x="70" y="1650" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">тестовый тип при наличии, статус, срок и занятые кабинеты. Текущий активный тариф выделен в списке, его повторная активация заблокирована. Истёкший тариф не помечается активным.</text>
<text x="70" y="1704" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>