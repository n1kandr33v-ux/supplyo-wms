<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="3450" viewBox="0 0 1500 3450">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="1500" height="3450" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 24</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">24 · Ozon: этикетки и печать</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Разрешённый кабинет / склад / компьютер / принтер</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Печать после подтверждённой сборки. API, PDF и агент проверены fixtures; реальный Ozon кабинет и бумага требуют проверки.</text>
<path d="M 748.9999999999998 464 L 748.9999999999998 584" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 672.3333333333331 768 L 672.3333333333331 806 L 411.33333333333326 806 L 411.33333333333326 888" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 411.33333333333326 1072 L 411.33333333333326 1192" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 411.33333333333326 1404 L 411.33333333333326 1524" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 487.99999999999994 1708 L 488 1974" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 564.6666666666667 2158 L 564.6666666666667 2196 L 1094.6666666666665 2196 L 1094.6666666666665 2278" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1171.3333333333333 2462 L 1171.3333333333333 2582" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1171.3333333333333 2766 L 1171.3333333333333 3032" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1017.9999999999999 3032 L 1017.9999999999999 2950 L 840.3333333333333 2950 L 840.3333333333333 2526 L 1017.9999999999999 2526 L 1017.9999999999999 2462" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 825.6666666666665 768 L 825.6666666666665 2500 L 526.3333333333333 2500 L 526.3333333333333 2582" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 334.66666666666663 1708 L 334.66666666666663 1746 L 157 1746 L 157 2500 L 296.33333333333326 2500 L 296.33333333333326 2582" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 411.33333333333337 2158 L 411.33333333333326 2582" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="347" y="1826" width="143" height="30" rx="4" fill="white"/>
<text x="418.5" y="1848" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Полный файл</text>
<rect x="1170.3333333333333" y="2884" width="160" height="30" rx="4" fill="white"/>
<text x="1250.3333333333333" y="2906" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Подтверждение</text>
<rect x="737.3333333333333" y="2659" width="105" height="30" rx="4" fill="white"/>
<text x="789.8333333333333" y="2681" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Новый ID</text>
<rect x="824.6666666666665" y="1601" width="140" height="30" rx="4" fill="white"/>
<text x="894.6666666666665" y="1623" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Несовместим</text>
<rect x="66" y="2051" width="93" height="30" rx="4" fill="white"/>
<text x="112.5" y="2073" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Ошибка</text>
<rect x="320.33333333333326" y="2355" width="93" height="30" rx="4" fill="white"/>
<text x="366.83333333333326" y="2377" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Ошибка</text>
<rect x="518.9999999999998" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="748.9999999999998" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОЖИДАЕТ ОТГРУЗКИ</text>
<text x="748.9999999999998" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Печать в списке заказов или после</text>
<text x="748.9999999999998" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">завершения сборки. Проверить склад,</text>
<text x="748.9999999999998" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подписку и право сборки.</text>
<rect x="518.9999999999998" y="584" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="748.9999999999998" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">АГЕНТ И ПРИНТЕР</text>
<text x="748.9999999999998" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверить mediaSizes и постоянный ID</text>
<text x="748.9999999999998" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">компьютера. Выбранный принтер</text>
<text x="748.9999999999998" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">фиксируется в задании.</text>
<rect x="181.33333333333326" y="888" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="411.33333333333326" y="945.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОСТОЯННОЕ ЗАДАНИЕ</text>
<text x="411.33333333333326" y="973.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Один незавершённый job на</text>
<text x="411.33333333333326" y="1001.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отправление. Другой компьютер не</text>
<text x="411.33333333333326" y="1029.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">получает его для повторной печати.</text>
<rect x="181.33333333333326" y="1192" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="411.33333333333326" y="1249.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СФОРМИРОВАТЬ ЭТИКЕТКУ</text>
<text x="411.33333333333326" y="1277.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ozon v3 create → small_label или</text>
<text x="411.33333333333326" y="1305.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">big_label. Общая подготовка и</text>
<text x="411.33333333333326" y="1333.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ожидание очереди, 429 сохраняет</text>
<text x="411.33333333333326" y="1361.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">паузу.</text>
<rect x="181.33333333333326" y="1524" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="411.33333333333326" y="1581.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОЛУЧИТЬ PDF</text>
<text x="411.33333333333326" y="1609.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ozon v2 get: только completed и</text>
<text x="411.33333333333326" y="1637.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">полный результат одного отправления,</text>
<text x="411.33333333333326" y="1665.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">без unprinted ошибок.</text>
<rect x="258" y="1974" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="488.0" y="2031.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОДГОТОВИТЬ СТРАНИЦЫ</text>
<text x="488.0" y="2059.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только HTTPS Ozon CDN, лимиты</text>
<text x="488.0" y="2087.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">PDF/страниц. Poppler 300 dpi сохраняет</text>
<text x="488.0" y="2115.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">CropBox и поворот, размеры в мм.</text>
<rect x="864.6666666666665" y="2278" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1094.6666666666665" y="2335.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПЕЧАТЬ</text>
<text x="1094.6666666666665" y="2363.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Неизменяемые PNG + размеры →</text>
<text x="1094.6666666666665" y="2391.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">существующий агент. Job ID и привязка</text>
<text x="1094.6666666666665" y="2419.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">к устройству защищают повтор.</text>
<rect x="941.3333333333333" y="2582" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1171.3333333333333" y="2639.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОДТВЕРЖДЕНИЕ</text>
<text x="1171.3333333333333" y="2667.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только после ответа агента сохранить</text>
<text x="1171.3333333333333" y="2695.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">квитанцию. Потеря ответа → тот же</text>
<text x="1171.3333333333333" y="2723.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">job/тело без нового экземпляра.</text>
<rect x="864.6666666666665" y="3032" width="460" height="184" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="1094.6666666666665" y="3089.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">НАМЕРЕННЫЙ ПОВТОР</text>
<text x="1094.6666666666665" y="3117.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Отдельное подтверждение, новый job</text>
<text x="1094.6666666666665" y="3145.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ID. Используется сохранённая</text>
<text x="1094.6666666666665" y="3173.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">этикетка.</text>
<rect x="181.33333333333326" y="2582" width="460" height="184" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="411.33333333333326" y="2639.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОШИБКА / СТАРЫЙ АГЕНТ</text>
<text x="411.33333333333326" y="2667.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не печатать неполный PDF.</text>
<text x="411.33333333333326" y="2695.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Предложить обновление агента или</text>
<text x="411.33333333333326" y="2723.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">безопасный повтор подготовки.</text>
<text x="70" y="3316" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Кнопка печати у awaiting_deliver в списке и после сборки. Ozon рекомендует генерацию через 45–60 секунд после сборки;</text>
<text x="70" y="3344" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">подготовка и опрос сохраняются в БД. Текущий агент обновляется один раз. Старые WB задания совместимы. Ответ агента</text>
<text x="70" y="3372" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">подтверждает приём спулером, а не выход бумаги.</text>
<text x="70" y="3422" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>