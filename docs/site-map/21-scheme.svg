<path d="M 346 520 L 346 740 L 860 740 L 860 778" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 438 520 L 438 688 L 1980 688 L 1980 778" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="254" y="280" width="460" height="240" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="484.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">УЖЕ РАБОТАЕТ</text>
<text x="484.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">WB FBS: магазины, доступы, склады,</text>
<text x="484.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сотрудники, заказы, поставки, КИЗ,</text>
<text x="484.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">печать, доставка и остатки.</text>
<text x="484.0" y="449.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Учёт/работы/счета сохраняются на</text>
<text x="484.0" y="477.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сервере.</text>
<rect x="3990" y="778" width="460" height="240" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="4220.0" y="835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОБНОВЛЕНИЯ 10–12 НОЯБРЯ</text>
<text x="4220.0" y="863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Размещение и сортировка; общий</text>
<text x="4220.0" y="891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">опрос КИЗ; filled; текст стикера;</text>
<text x="4220.0" y="919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">следующий ненапечатанный заказ;</text>
<text x="4220.0" y="947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">полная история поставок; замена</text>
<text x="4220.0" y="975.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ключа.</text>
<a href="#20"><title>Открыть раздел 20</title>
<rect x="4550" y="778" width="460" height="212" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="4780.0" y="835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ANDROID → 20</text>
<text x="4780.0" y="863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Локальные отметки, жесты, общие</text>
<text x="4780.0" y="891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">заметки, удаление и анимации.</text>
<text x="4780.0" y="919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Влияют только на мобильный</text>
<text x="4780.0" y="947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сценарий.</text>
</a>
<rect x="70" y="778" width="460" height="240" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="300.0" y="835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">РЕАЛЬНАЯ ОПЛАТА — ПЛАН</text>
<text x="300.0" y="863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сейчас тестовая активация без</text>
<text x="300.0" y="891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">списания.</text>
<text x="300.0" y="919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Провайдер, подтверждение платежей,</text>
<text x="300.0" y="947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">продление и защита от повторной</text>
<text x="300.0" y="975.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">оплаты требуют отдельной интеграции.</text>
<rect x="1190" y="778" width="460" height="212" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="1420.0" y="835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">OZON — ПЕРВЫЙ ЭТАП ГОТОВ</text>
<text x="1420.0" y="863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Подключение по Client ID/API-ключу,</text>
<text x="1420.0" y="891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">склады и FBS-отправления → 22.</text>
<text x="1420.0" y="919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сборка, маркировка, этикетки и остатки</text>
<text x="1420.0" y="947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ещё не подключены.</text>
<a href="#18"><title>Открыть раздел 18</title>
<rect x="2870" y="778" width="460" height="240" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="3100.0" y="835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПРОФИЛЬ И БЕЗОПАСНОСТЬ → 18</text>
<text x="3100.0" y="863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Live — просмотр и подписка. Полный</text>
<text x="3100.0" y="891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">редактор, организация,</text>
<text x="3100.0" y="919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">смена/восстановление пароля и</text>
<text x="3100.0" y="947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подтверждение почты остаются</text>
<text x="3100.0" y="975.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">планом.</text>
</a>
<rect x="3430" y="778" width="460" height="268" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="3660.0" y="835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ДОПОЛНИТЕЛЬНАЯ СОРТИРОВКА —</text>
<text x="3660.0" y="863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ПЛАН</text>
<text x="3660.0" y="891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Меню «Сначала требуют внимания /</text>
<text x="3660.0" y="919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">сначала готовые» из макета ещё не</text>
<text x="3660.0" y="947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">перенесено.</text>
<text x="3660.0" y="975.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Автоматический порядок адрес →</text>
<text x="3660.0" y="1003.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">баркод → номер заказа работает.</text>
<rect x="2310" y="778" width="460" height="268" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="2540.0" y="835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ВНЕШНИЕ ПОСТАВКИ WB —</text>
<text x="2540.0" y="863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">РЕАЛИЗОВАНО</text>
<text x="2540.0" y="891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Открытые поставки и их заказы</text>
<text x="2540.0" y="919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">импортируются общей очередью</text>
<text x="2540.0" y="947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">кабинета. Печать/КИЗ сохраняются.</text>
<text x="2540.0" y="975.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Полный импорт закрытой истории —</text>
<text x="2540.0" y="1003.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">отдельно.</text>
<rect x="630" y="778" width="460" height="240" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="860.0" y="835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЭКСПЛУАТАЦИЯ — ЧАСТИЧНО</text>
<text x="860.0" y="863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ежедневный бэкап на VPS есть.</text>
<text x="860.0" y="891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Внешняя копия/проверка</text>
<text x="860.0" y="919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">восстановления, полный аудит и</text>
<text x="860.0" y="947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">распределённые лимиты ещё требуют</text>
<text x="860.0" y="975.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">доведения.</text>
<rect x="1750" y="778" width="460" height="268" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="1980.0" y="835.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ГРАНИЦЫ ПРОВЕРКИ</text>
<text x="1980.0" y="863.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Физическая печать — на реальном</text>
<text x="1980.0" y="891.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">принтере. Android — на телефоне</text>
<text x="1980.0" y="919.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">пользователя.</text>
<text x="1980.0" y="947.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Подписанный установщик и</text>
<text x="1980.0" y="975.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">обновление печатного агента ещё не</text>
<text x="1980.0" y="1003.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">завершены.</text>
<text x="70" y="1146" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Этот раздел не добавляет новые обещания к продукту: показывает границы реализации. Тестовые ответы WB/агента не считаются реальной печатью или оплатой.</text>
<text x="70" y="1228" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>