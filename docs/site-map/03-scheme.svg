<svg xmlns="http://www.w3.org/2000/svg" width="2671" height="2810" viewBox="0 0 2671 2810">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="2671" height="2810" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 03</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">03 · Навигация и проверка прав</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Все роли</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Разделы серверной версии. Проверки на сервере обязательны.</text>
<path d="M 1411.6666666666665 520 L 1411.6666666666665 558 L 966.6666666666666 558 L 966.6666666666666 658.6666666666667" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1641.6666666666665 520 L 1641.6666666666665 558 L 2086.6666666666665 558 L 2086.6666666666665 640" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1526.6666666666665 520 L 1526.6666666666665 654" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1043.3333333333333 870.6666666666667 L 1043.3333333333335 918 L 1411.6666666666665 918 L 1411.6666666666665 1144.0" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 2086.6666666666665 880 L 2086.6666666666665 918 L 1641.6666666666665 918 L 1641.6666666666665 1144.0" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1526.6666666666665 866 L 1526.6666666666665 1000.0" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1572.6666666666665 1518.4 L 1572.6666666666665 1640 L 2040.6666666666665 1640 L 2040.6666666666665 1696" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1480.6666666666665 1518.4 L 1480.6666666666665 1710" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1388.6666666666665 1403.2 L 1388.6666666666665 1614 L 920.6666666666666 1614 L 920.6666666666666 1696" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 2040.6666666666665 1908 L 2040.6666666666665 1972 L 1150.6666666666665 1972 L 1150.6666666666665 2028" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1480.6666666666665 1894 L 1480.6666666666665 1946 L 1035.6666666666665 1946 L 1035.6666666666665 2028" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 920.6666666666666 1908 L 920.6666666666666 2028" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1664.6666666666665 1403.2 L 1664.6666666666665 1614 L 2370.6666666666665 1614 L 2370.6666666666665 2028" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1035.6666666666665 2240 L 1035.6666666666665 2360" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 890 870.6666666666667 L 890 1000" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="2369.6666666666665" y="1787" width="217" height="30" rx="4" fill="white"/>
<text x="2478.1666666666665" y="1809" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Проверка не пройдена</text>
<rect x="1296.6666666666665" y="280" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1526.6666666666665" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЛОГО SUPPLY</text>
<text x="1526.6666666666665" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Всегда открывает 08 Обзор, в том</text>
<text x="1526.6666666666665" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">числе без подписки.</text>
<text x="1526.6666666666665" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Плавное сужение меню: правая часть</text>
<text x="1526.6666666666665" y="449.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">слова скрывается, S остаётся на</text>
<text x="1526.6666666666665" y="477.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">месте.</text>
<rect x="736.6666666666666" y="658.6666666666667" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="966.6666666666666" y="715.6666666666667" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОСНОВНОЕ МЕНЮ</text>
<text x="966.6666666666666" y="743.6666666666667" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Новые заказы → 09</text>
<text x="966.6666666666666" y="771.6666666666667" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сборка → 10 / 11 / 12</text>
<text x="966.6666666666666" y="799.6666666666667" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Поставки → 14</text>
<text x="966.6666666666666" y="827.6666666666667" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Остатки → 14</text>
<rect x="1856.6666666666665" y="640" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2086.6666666666665" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">МЕНЮ «НАСТРОЙКИ»</text>
<text x="2086.6666666666665" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Магазины → 04</text>
<text x="2086.6666666666665" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Доступ фулфилменту → 05</text>
<text x="2086.6666666666665" y="781.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Клиенты → 05</text>
<text x="2086.6666666666665" y="809.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Печать → 13</text>
<text x="2086.6666666666665" y="837.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Подписка → 02</text>
<rect x="1296.6666666666665" y="654" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1526.6666666666665" y="711.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">МЕНЮ АККАУНТА</text>
<text x="1526.6666666666665" y="739.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Профиль → 18</text>
<text x="1526.6666666666665" y="767.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Склады / сотрудники → 06 / 07</text>
<text x="1526.6666666666665" y="795.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Учёт → 15–17</text>
<text x="1526.6666666666665" y="823.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Выйти → закрыть сессию</text>
<polygon points="1526.6666666666665,1000 1756.6666666666665,1288.0 1526.6666666666665,1576 1296.6666666666665,1288.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="1526.6666666666665" y="1183.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Проверка каждой</text>
<text x="1526.6666666666665" y="1211.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">операции</text>
<text x="1526.6666666666665" y="1239.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Кто вошёл? Чей ресурс?</text>
<text x="1526.6666666666665" y="1267.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Какие кабинет и склад</text>
<text x="1526.6666666666665" y="1295.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">разрешены?</text>
<text x="1526.6666666666665" y="1323.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Активна ли нужная</text>
<text x="1526.6666666666665" y="1351.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подписка?</text>
<text x="1526.6666666666665" y="1379.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Есть ли право на</text>
<text x="1526.6666666666665" y="1407.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">действие?</text>
<rect x="1810.6666666666665" y="1696" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="2040.6666666666665" y="1753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СВОЙ МАГАЗИН</text>
<text x="2040.6666666666665" y="1781.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Добавить API / выдать доступ: без</text>
<text x="2040.6666666666665" y="1809.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подписки.</text>
<text x="2040.6666666666665" y="1837.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Работать в ВМС: нужна собственная</text>
<text x="2040.6666666666665" y="1865.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подписка.</text>
<rect x="1250.6666666666665" y="1710" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1480.6666666666665" y="1767.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">КЛИЕНТСКИЙ МАГАЗИН</text>
<text x="1480.6666666666665" y="1795.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Принятый и неотозванный доступ +</text>
<text x="1480.6666666666665" y="1823.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подписка ФФ.</text>
<text x="1480.6666666666665" y="1851.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Ровно один разрешённый склад WB.</text>
<rect x="690.6666666666666" y="1696" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="920.6666666666666" y="1753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОТРУДНИК</text>
<text x="920.6666666666666" y="1781.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Назначение по email + физический</text>
<text x="920.6666666666666" y="1809.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">склад + привязки WB + конкретные</text>
<text x="920.6666666666666" y="1837.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">права.</text>
<text x="920.6666666666666" y="1865.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Личная подписка не требуется.</text>
<rect x="2140.6666666666665" y="2028" width="460" height="184" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="2370.6666666666665" y="2085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Доступа нет</text>
<text x="2370.6666666666665" y="2113.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Кнопка неактивна, при наведении</text>
<text x="2370.6666666666665" y="2141.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">понятная причина.</text>
<text x="2370.6666666666665" y="2169.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Прямой запрос к API тоже отклоняется.</text>
<rect x="805.6666666666666" y="2028" width="460" height="212" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="1035.6666666666665" y="2085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Доступ разрешён</text>
<text x="1035.6666666666665" y="2113.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только разрешённые данные и</text>
<text x="1035.6666666666665" y="2141.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">действия.</text>
<text x="1035.6666666666665" y="2169.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Смена кабинета не даёт доступ к</text>
<text x="1035.6666666666665" y="2197.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">чужому складу.</text>
<rect x="70" y="280" width="460" height="240" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="300.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОВМЕЩЕНИЕ РОЛЕЙ</text>
<text x="300.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Можно иметь несколько своих API и</text>
<text x="300.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">принять код клиента.</text>
<text x="300.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сервер объединяет разрешённые</text>
<text x="300.0" y="449.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ресурсы, сохраняя ограничения</text>
<text x="300.0" y="477.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">каждого.</text>
<rect x="805.6666666666666" y="2360" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1035.6666666666665" y="2417.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОСЛЕ ОБНОВЛЕНИЯ СТРАНИЦЫ</text>
<text x="1035.6666666666665" y="2445.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">В том же аккаунте и вкладке</text>
<text x="1035.6666666666665" y="2473.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">восстановить раздел, кабинет и</text>
<text x="1035.6666666666665" y="2501.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">выбранную поставку.</text>
<text x="1035.6666666666665" y="2529.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не возвращать автоматически в</text>
<text x="1035.6666666666665" y="2557.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">«Новые заказы».</text>
<rect x="660" y="1000" width="460" height="268" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="890.0" y="1057.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПЛАВНЫЕ ПЕРЕХОДЫ</text>
<text x="890.0" y="1085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Открытие разделов, меню, окон и</text>
<text x="890.0" y="1113.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">боковой панели. Профиль и настройки</text>
<text x="890.0" y="1141.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">не прыгают.</text>
<text x="890.0" y="1169.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Фоновое обновление не повторяет</text>
<text x="890.0" y="1197.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">анимацию. Учитывается</text>
<text x="890.0" y="1225.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">reduced-motion.</text>
<text x="70" y="2700" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Настройки и профиль открываются отдельными меню справа. Закрытие уведомлений — крестик справа. Права всегда проверяются сервером.</text>
<text x="70" y="2782" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>