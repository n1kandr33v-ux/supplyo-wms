<svg xmlns="http://www.w3.org/2000/svg" width="1797" height="2362" viewBox="0 0 1797 2362">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="1797" height="2362" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 15</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">15 · Учёт: доходы, расходы и прибыль</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Владелец; иные роли — только при отдельном разрешении</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Записи и документы сохраняются сервером; финансовые права требуют отдельной политики.</text>
<path d="M 860 492 L 860 612" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 936.6666666666667 852 L 936.6666666666667 972" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 783.3333333333334 852 L 783.3333333333334 890 L 453.3333333333335 890 L 453.3333333333334 988.8" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 852 L 300.0000000000001 988.8" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 376.66666666666674 1144.8 L 376.66666666666674 1290" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 936.6666666666667 1488 L 936.6666666666667 1608" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 376.66666666666674 1474 L 376.66666666666674 1526 L 821.6666666666667 1526 L 821.6666666666667 1608" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 706.6666666666667 1608 L 706.6666666666667 1552 L 107.66666666666674 1552 L 107.66666666666674 1194 L 261.66666666666674 1194 L 261.66666666666674 1144.8" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 821.6666666666667 1792 L 821.6666666666667 1912" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 491.66666666666674 1144.8 L 491.66666666666674 1194 L 1496.6666666666667 1194 L 1496.6666666666667 1276" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1496.6666666666667 1488 L 1496.6666666666667 1912" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1495.6666666666667" y="1685" width="143" height="30" rx="4" fill="white"/>
<text x="1567.1666666666667" y="1707" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Есть источник</text>
<rect x="630" y="280" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">УЧЁТ → ВЫБРАТЬ ФИЗИЧЕСКИЙ</text>
<text x="860.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">СКЛАД</text>
<text x="860.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Учёт ведётся отдельно по каждому</text>
<text x="860.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">складу фулфилмента.</text>
<text x="860.0" y="449.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Это не склад WB клиента.</text>
<rect x="630" y="612" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПЕРИОД ПО УМОЛЧАНИЮ —</text>
<text x="860.0" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ТЕКУЩИЙ МЕСЯЦ</text>
<text x="860.0" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">При переключении месяца выбирается</text>
<text x="860.0" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">весь месяц.</text>
<text x="860.0" y="781.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Пользователь может выбрать другой</text>
<text x="860.0" y="809.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">интервал.</text>
<rect x="706.6666666666667" y="972" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="936.6666666666667" y="1029.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ДОХОДЫ / РАСХОДЫ / ПРИБЫЛЬ</text>
<text x="936.6666666666667" y="1057.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Итоги зависят от склада и дат.</text>
<text x="936.6666666666667" y="1085.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Поиск и вид операции меняют список,</text>
<text x="936.6666666666667" y="1113.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">а не общие итоги.</text>
<rect x="146.66666666666674" y="988.8" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666674" y="1045.8" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ОПЕРАЦИИ</text>
<text x="376.66666666666674" y="1073.8" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Дата → вид операции → описание →</text>
<text x="376.66666666666674" y="1101.8" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">контрагент → сумма → доход / расход.</text>
<rect x="70" y="696" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="300.0" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПОИСК И ВИД ОПЕРАЦИИ</text>
<text x="300.0" y="781.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Материалы, зарплата, аренда, услуги</text>
<text x="300.0" y="809.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">фулфилмента, хранение, другое.</text>
<rect x="146.66666666666674" y="1290" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="376.66666666666674" y="1347.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ДОБАВИТЬ ДОХОД / РАСХОД</text>
<text x="376.66666666666674" y="1375.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Дата, вид операции, описание,</text>
<text x="376.66666666666674" y="1403.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">контрагент, сумма, файл / фото</text>
<text x="376.66666666666674" y="1431.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">документа.</text>
<a href="#16"><title>Открыть раздел 16</title>
<rect x="706.6666666666667" y="1304" width="460" height="184" rx="14" fill="#EDE6FF" stroke="#9C83CF" stroke-width="2"/>
<text x="936.6666666666667" y="1361.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">АВТОМАТИЧЕСКИЕ ОПЕРАЦИИ</text>
<text x="936.6666666666667" y="1389.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">16 Выплата сотруднику → расход.</text>
<text x="936.6666666666667" y="1417.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">17 Оплаченный счёт → доход.</text>
<text x="936.6666666666667" y="1445.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Без двойного учёта.</text>
</a>
<rect x="591.6666666666667" y="1608" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="821.6666666666667" y="1665.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОХРАНИТЬ ОПЕРАЦИЮ</text>
<text x="821.6666666666667" y="1693.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Проверить склад, сумму и доступ к</text>
<text x="821.6666666666667" y="1721.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">файлам.</text>
<text x="821.6666666666667" y="1749.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Обновить список и итоги.</text>
<rect x="1266.6666666666667" y="1276" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1496.6666666666667" y="1333.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ИЗМЕНИТЬ / УДАЛИТЬ</text>
<text x="1496.6666666666667" y="1361.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Подтверждение показывает описание и</text>
<text x="1496.6666666666667" y="1389.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">имя контрагента.</text>
<text x="1496.6666666666667" y="1417.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Обычная запись удаляется после</text>
<text x="1496.6666666666667" y="1445.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">подтверждения.</text>
<rect x="1266.6666666666667" y="1912" width="460" height="240" rx="14" fill="#FFE9D5" stroke="#C99768" stroke-width="2"/>
<text x="1496.6666666666667" y="1969.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СВЯЗАННАЯ ЗАПИСЬ</text>
<text x="1496.6666666666667" y="1997.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Удаление / исправление дохода по</text>
<text x="1496.6666666666667" y="2025.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">счёту или выплаты должно</text>
<text x="1496.6666666666667" y="2053.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">согласованно исправлять источник.</text>
<text x="1496.6666666666667" y="2081.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не оставлять оплаченный счёт без</text>
<text x="1496.6666666666667" y="2109.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">дохода.</text>
<rect x="591.6666666666667" y="1912" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="821.6666666666667" y="1969.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ДОКУМЕНТЫ</text>
<text x="821.6666666666667" y="1997.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Просмотр / скачивание вложений</text>
<text x="821.6666666666667" y="2025.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">только пользователями с доступом к</text>
<text x="821.6666666666667" y="2053.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">записи.</text>
<text x="821.6666666666667" y="2081.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Файлы сохраняются с записью.</text>
<text x="70" y="2334" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>