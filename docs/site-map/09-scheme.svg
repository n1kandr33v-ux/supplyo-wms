<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2934" viewBox="0 0 1500 2934">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="1500" height="2934" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 09</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">09 · Новые заказы → новая / существующая поставка</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Владелец / сотрудник с правом поставок</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Создание новой поставки и добавление заказов в существующую реализованы.</text>
<path d="M 783.3333333333333 464 L 783.3333333333333 584" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 783.3333333333333 796 L 783.3333333333333 916" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 1072 L 860 1192" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 706.6666666666666 1072 L 706.6666666666666 1110 L 300 1110 L 300 1220" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 1432 L 860 1588.6666666666667" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 300 1404 L 300 1470 L 706.6666666666666 1470 L 706.6666666666666 1588.6666666666667" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 706.6666666666666 1735.3333333333333 L 706.6666666666666 1810 L 300 1810 L 300 2038" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 1735.3333333333333 L 860 2038" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 860 2250 L 860 2314 L 491.6666666666667 2314 L 491.6666666666667 2516" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 975 2250 L 975 2516" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 338.33333333333337 2516 L 338.33333333333337 2434 L 462.6666666666667 2434 L 462.6666666666667 2288 L 745 2288 L 745 2250" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="245" y="1890" width="57" height="30" rx="4" fill="white"/>
<text x="273.5" y="1912" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Нет</text>
<rect x="859" y="1890" width="49" height="30" rx="4" fill="white"/>
<text x="883.5" y="1912" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Да</text>
<rect x="490.6666666666667" y="2368" width="188" height="30" rx="4" fill="white"/>
<text x="584.6666666666667" y="2390" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Неясный результат</text>
<rect x="827" y="2368" width="150" height="30" rx="4" fill="white"/>
<text x="902.0" y="2390" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Подтверждено</text>
<rect x="303.6666666666667" y="2368" width="161" height="30" rx="4" fill="white"/>
<text x="384.1666666666667" y="2390" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Сверка / повтор</text>
<rect x="553.3333333333333" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="783.3333333333333" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ВЫБОР КОНТЕКСТА</text>
<text x="783.3333333333333" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Кабинет + один склад WB.</text>
<text x="783.3333333333333" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Для доступа клиента склад уже</text>
<text x="783.3333333333333" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ограничен выданным доступом.</text>
<rect x="553.3333333333333" y="584" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="783.3333333333333" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">НОВЫЕ ЗАКАЗЫ</text>
<text x="783.3333333333333" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Номер заказа, товар, баркоды, склад</text>
<text x="783.3333333333333" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">WB, дата.</text>
<text x="783.3333333333333" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Поиск по номеру / артикулу / баркоду.</text>
<text x="783.3333333333333" y="753.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Код и адрес здесь не показываются.</text>
<rect x="553.3333333333333" y="916" width="460" height="156" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="783.3333333333333" y="973.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ВЫБРАТЬ ЗАКАЗЫ</text>
<text x="783.3333333333333" y="1001.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">По одному или все показанные.</text>
<text x="783.3333333333333" y="1029.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Счётчик в кнопке; сетка не смещается.</text>
<rect x="630" y="1192" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="1249.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ДОБАВИТЬ В ПОСТАВКУ</text>
<text x="860.0" y="1277.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только открытая поставка того же</text>
<text x="860.0" y="1305.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">кабинета и склада. Если их несколько</text>
<text x="860.0" y="1333.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">— выбрать.</text>
<text x="860.0" y="1361.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Без подходящей поставки кнопка</text>
<text x="860.0" y="1389.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">неактивна.</text>
<rect x="70" y="1220" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="300.0" y="1277.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОЗДАТЬ ПОСТАВКУ</text>
<text x="300.0" y="1305.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Новая поставка для выбранных</text>
<text x="300.0" y="1333.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">заказов одного склада.</text>
<text x="300.0" y="1361.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не смешивать кабинеты и склады.</text>
<polygon points="783.3333333333333,1552 1013.3333333333333,1662.0 783.3333333333333,1772 553.3333333333333,1662.0" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="783.3333333333333" y="1655.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Можно добавить</text>
<text x="783.3333333333333" y="1683.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">все выбранные заказы?</text>
<rect x="70" y="2038" width="460" height="184" rx="14" fill="#FFE3DE" stroke="#D37D6A" stroke-width="2"/>
<text x="300.0" y="2095.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЗАКАЗ ИЗМЕНИЛСЯ</text>
<text x="300.0" y="2123.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Уже добавлен / отменён / другой склад</text>
<text x="300.0" y="2151.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">/ нет прав.</text>
<text x="300.0" y="2179.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Показать причину, обновить список.</text>
<rect x="630" y="2038" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="2095.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЗАПРОС В WB</text>
<text x="860.0" y="2123.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Создать / использовать поставку →</text>
<text x="860.0" y="2151.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">добавить только выбранные ID</text>
<text x="860.0" y="2179.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">заказов.</text>
<text x="860.0" y="2207.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Повтор запроса не создаёт дубликат.</text>
<rect x="185" y="2516" width="460" height="184" rx="14" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="415.0" y="2573.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЧАСТИЧНЫЙ ОТВЕТ / СБОЙ</text>
<text x="415.0" y="2601.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сверить результат с WB.</text>
<text x="415.0" y="2629.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не объявлять успех и не создавать</text>
<text x="415.0" y="2657.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">вторую поставку вслепую.</text>
<rect x="745" y="2516" width="460" height="156" rx="14" fill="#DFF4E4" stroke="#65A773" stroke-width="2"/>
<text x="975.0" y="2573.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ЗАКАЗЫ ДОБАВЛЕНЫ</text>
<text x="975.0" y="2601.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Уходят из новых заказов.</text>
<text x="975.0" y="2629.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Поставка открывается в сборке → 10.</text>
<text x="70" y="2800" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Обновление заказов: каждые 60 секунд в фоне без лишних уведомлений. Ручное «Обновить» пропускает обычную минутную паузу, но</text>
<text x="70" y="2828" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">не реальные ограничения WB. Открытые поставки, созданные напрямую в WB, импортируются общей серверной очередью вместе с</text>
<text x="70" y="2856" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">составом. Уже закрытая внешняя история целиком не импортируется.</text>
<text x="70" y="2906" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>