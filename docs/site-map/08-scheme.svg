<svg xmlns="http://www.w3.org/2000/svg" width="2165" height="2010" viewBox="0 0 2165 2010">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect width="2165" height="2010" fill="#FFFFFF"/>
<text x="70" y="43" font-family="Arial,sans-serif" font-size="17" fill="#6A7585" font-weight="400" text-anchor="start">SUPPLY / КАРТА САЙТА И ANDROID / 08</text>
<text x="70" y="89" font-family="Arial,sans-serif" font-size="32" fill="#233044" font-weight="700" text-anchor="start">08 · Обзор по нажатию на логотип</text>
<text x="70" y="127" font-family="Arial,sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">Клиент / ФФ / сотрудник</text>
<text x="70" y="166" font-family="Arial,sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Реализация: Серверный дашборд. Данные читаются из базы.</text>
<path d="M 1727 464 L 1727 584" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1865 768 L 1865 910" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1773 768 L 1773 858 L 1305 858 L 1305 896" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1681 768 L 1681 832 L 745 832 L 745 910" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1865 1094 L 1865 1146 L 1420 1146 L 1420 1228" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1305 1108 L 1305 1228" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 745 1094 L 745 1146 L 1190 1146 L 1190 1228" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1305 1468 L 1305 1532 L 860 1532 L 860 1588" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1420 1468 L 1420 1588" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1589 768 L 1589 806 L 414 806 L 414 1228" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1190 1468 L 1190 1506 L 300 1506 L 300 1588" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="285" y="987" width="131" height="30" rx="4" fill="white"/>
<text x="350.5" y="1009" font-family="Arial,sans-serif" font-size="18" fill="#233044" font-weight="400" text-anchor="middle">Нет складов</text>
<rect x="1497" y="280" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1727.0" y="337.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Нажать supply</text>
<text x="1727.0" y="365.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Всегда открыть «Обзор».</text>
<text x="1727.0" y="393.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не зависит от выбранной страницы или</text>
<text x="1727.0" y="421.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">личной подписки.</text>
<rect x="1497" y="584" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1727.0" y="641.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Сервер собирает разрешённые склады</text>
<text x="1727.0" y="669.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">По кабинету + warehouseId.</text>
<text x="1727.0" y="697.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Дубликаты одного контекста</text>
<text x="1727.0" y="725.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">объединяются.</text>
<rect x="1635" y="910" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1865.0" y="967.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">КЛИЕНТ БЕЗ ПОДПИСКИ</text>
<text x="1865.0" y="995.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только свои склады с принятым</text>
<text x="1865.0" y="1023.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">активным доступом ФФ.</text>
<text x="1865.0" y="1051.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не все склады его кабинета.</text>
<rect x="1075" y="896" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1305.0" y="953.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ВЛАДЕЛЕЦ ФФ / ПЛАТНЫЙ</text>
<text x="1305.0" y="981.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ПРОДАВЕЦ</text>
<text x="1305.0" y="1009.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Собственные складские контексты +</text>
<text x="1305.0" y="1037.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">принятые клиентские.</text>
<text x="1305.0" y="1065.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не смешивать кабинеты.</text>
<rect x="515" y="910" width="460" height="184" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="745.0" y="967.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">СОТРУДНИК</text>
<text x="745.0" y="995.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Только назначенные склады с правом</text>
<text x="745.0" y="1023.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">просмотра.</text>
<text x="745.0" y="1051.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не все склады работодателя.</text>
<rect x="1075" y="1228" width="460" height="240" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1305.0" y="1285.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">КАРТОЧКА КОНТЕКСТА</text>
<text x="1305.0" y="1313.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сначала крупно ИП / название</text>
<text x="1305.0" y="1341.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">кабинета, ниже название склада.</text>
<text x="1305.0" y="1369.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Новые заказы · на сборке / готово из N</text>
<text x="1305.0" y="1397.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">· количество поставок · время</text>
<text x="1305.0" y="1425.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">обновления.</text>
<rect x="630" y="1588" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="860.0" y="1645.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Для клиента</text>
<text x="860.0" y="1673.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">«Фулфилмент: название физического</text>
<text x="860.0" y="1701.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">склада ФФ».</text>
<text x="860.0" y="1729.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не ФИО зарегистрированного</text>
<text x="860.0" y="1757.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">владельца.</text>
<rect x="1190" y="1588" width="460" height="212" rx="14" fill="#E2F1FF" stroke="#5197CE" stroke-width="2"/>
<text x="1420.0" y="1645.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Для ФФ и сотрудника</text>
<text x="1420.0" y="1673.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Не показывать пустую строку</text>
<text x="1420.0" y="1701.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">«Фулфилмент:».</text>
<text x="1420.0" y="1729.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Список относится к их рабочему</text>
<text x="1420.0" y="1757.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">доступу.</text>
<rect x="184" y="1228" width="460" height="184" rx="14" fill="#FFF0C9" stroke="#C99726" stroke-width="2"/>
<text x="414.0" y="1285.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">Нет разрешённых подключений</text>
<text x="414.0" y="1313.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">«Нет подключённых складов».</text>
<text x="414.0" y="1341.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Без приглашения выдать доступ.</text>
<text x="414.0" y="1369.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Настройки доступны через меню.</text>
<rect x="70" y="1588" width="460" height="212" rx="14" fill="#F5F6F8" stroke="#A5AFBE" stroke-width="2"/>
<text x="300.0" y="1645.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="600" text-anchor="middle">ПЕРЕЙТИ К РАБОТЕ</text>
<text x="300.0" y="1673.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Выбрать раздел в основном меню: 09</text>
<text x="300.0" y="1701.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Заказы, 10 Сборка, 14 Поставки.</text>
<text x="300.0" y="1729.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">Сводная карточка не обходит</text>
<text x="300.0" y="1757.0" font-family="Arial,sans-serif" font-size="20" fill="#233044" font-weight="400" text-anchor="middle">ограничения подписки и прав.</text>
<text x="70" y="1900" font-family="Arial,sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Счётчик поставок — число поставок данного кабинета и склада, а не число отгруженных заказов. Данные берутся из сохранённой базы.</text>
<text x="70" y="1982" font-family="Arial,sans-serif" font-size="16" fill="#6A7585" font-weight="400" text-anchor="start">↖ Оглавление — слева. Файл .drawio содержит редактируемые блоки и стрелки.</text></svg>